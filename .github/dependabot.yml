version: 2
updates:
# GitHub Actions
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: daily
  commit-message:
    prefix: "Changed"
# Gradle
- package-ecosystem: gradle
  directory: /
  schedule:
    interval: daily
  commit-message:
    prefix: "chore(deps)"
  ignore:
    # Kotlin 三件套需要统一升级
    # compose + serialization + ksp 都要升到同一 Kotlin 版本
    # 等 ksp 有升级 PR 后再一起合
    - dependency-name: "org.jetbrains.kotlin.plugin.compose"
      versions: [">=2.4.0"]
    - dependency-name: "org.jetbrains.kotlin.plugin.serialization"
      versions: [">=2.4.0"]
