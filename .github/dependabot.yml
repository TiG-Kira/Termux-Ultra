version: 2
updates:
# GitHub Actions
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: daily
  commit-message:
    prefix: "Changed"
# Gradle
- package-ecosystem: gradle
  directory: /
  schedule:
    interval: daily
  commit-message:
    prefix: "chore(deps)"
# 注：Kotlin 三件套（kotlin-gradle-plugin / plugin.compose / plugin.serialization）
# 必须升到同一 Kotlin 版本，请放在一起合并，不要单独合其中任何一个。
# KSP 自 2.3.x 起改用独立版本号、与 Kotlin 主版本解耦，无需跟随（2.3.12 即当前最新版）。
