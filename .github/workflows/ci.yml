name: 编译

on:
  push:
    paths-ignore:
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: 编译
        run: |
          ./gradlew :app:assembleDebug

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: app/build/outputs/apk/debug/**.apk
