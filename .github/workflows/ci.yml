name: 编译

# 每个 ABI 一个独立作业并行编译：单作业只编一份原生代码（CMake 只为该 ABI 配置），
# 内存峰值与耗时约为原来的 1/4；某一架构失败也不会连累其它架构出包。
#
# 编译逻辑（缓存策略 + 增量优先 + 全量降级重试 + 失败判定）已收敛到
# ./.github/actions/gradle-build，与 release_apk.yml 共用同一份实现，
# 两条流程的错误处理语义因此天然一致。
on:
  push:
    paths-ignore:
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Debug APK (${{ matrix.abi }})"
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      # AgentPaw 依赖走 GitHub Packages（公开包也要 token），gradle 仓库源读取该变量
      GITHUB_PACKAGES_TOKEN: ${{ github.token }}
    strategy:
      # 单架构失败时其余架构继续跑完，便于区分「某架构特有问题」与「全架构共性问题」
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - armeabi-v7a
          - x86
          - x86_64
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # 与 run_tests.yml 保持一致直接用 v6：v4 已被 GitHub 标记弃用，
      # runner 上会被强制跑在 Node 24。
      #
      # 刻意**不启用** setup-java 的 cache: gradle：
      #   1) 它内部走 actions/cache，PR 上会无条件回写，挤占仓库 10GB 配额
      #      把主线条目挤出 LRU（缓存隔离要求 PR 只读）；
      #   2) 它只覆盖 ~/.gradle，而下面的 gradle-build action 已完整缓存
      #      ~/.gradle/{caches,wrapper,daemon} + **/build + .cxx —— 留着是重复覆盖，
      #      两处写同一批目录反而容易互相干扰。
      - name: 设置 JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      # -Ptermux.abi=<abi> 让 NDK/CMake 只编译该架构，产出 app-<abi>-debug.apk
      # TERMUX_WORKFLOW_CLI=true 保持不变：Debug 走 CLI 版本配置。
      - name: 编译 ${{ matrix.abi }} Debug APK（增量优先，失败自动全量重试一次）
        uses: ./.github/actions/gradle-build
        with:
          gradle-task: ':app:assembleDebug'
          variant: debug
          abi: ${{ matrix.abi }}
          termux-workflow-cli: 'true'
          artifact-glob: 'app/build/outputs/apk/debug/*.apk'

      - name: 上传 ${{ matrix.abi }} Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: termux-ultra-debug-${{ matrix.abi }}
          archive: false
          if-no-files-found: error
          path: app/build/outputs/apk/debug/*.apk