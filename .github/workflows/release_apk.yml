name: 发布 APK 到 Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要附加 APK 的 Release tag（workflow_dispatch 时必填；release 事件自动取触发 tag）"
        required: false
        type: string
      build_universal:
        description: "手动触发时是否额外构建 universal 全架构包（release 事件下始终构建）"
        required: false
        type: boolean
        default: false

# 同一 tag 的发布构建串行化：不取消进行中的运行，避免构建到一半被打断、
# 结果 Release 上只挂了一半架构的包。
concurrency:
  group: release-apk-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  JKS_BASE64: 

jobs:
  # ── 1. 预检：Release 里是否已经有 APK ───────────────────────────────
  # 拆成独立作业后这个 API 调用只做一次，后续所有构建作业都看它的输出决定是否跳过。
  preflight:
    runs-on: ubuntu-26.04
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: 检查 Release 是否已附带 APK
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # release 事件 → 触发 tag；workflow_dispatch → 手动输入的 tag
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$tag" ]; then
            echo "::error::无法确定 tag：release 事件的 tag_name 和 workflow_dispatch 的 inputs.tag 都为空"
            exit 1
          fi
          echo "目标 tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          api_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}"
          assets=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "$api_url" \
            | jq -r '.assets[]?.name' 2>/dev/null | grep -i '\.apk$' || true)
          if [ -n "$assets" ]; then
            echo "存在 APK assets:"
            echo "$assets"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release 中没有 APK，开始构建..."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  # ── 2. 按架构并行构建 ─────────────────────────────────────────────
  # 每个 ABI 一个独立作业：CMake 只为该 ABI 配置与编译，四项原生构建互不干扰，
  # 单作业的内存峰值约 1/4、墙钟时间也降到 1/4 左右；4 个 APK 同时产出。
  # -Ptermux.abi=<abi> 只影响本作业，产物名由 app/build.gradle 统一改成
  # termux-app_<tag>_<abi>.apk。
  build:
    needs: preflight
    if: needs.preflight.outputs.skip == 'false'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      # 某一架构编译失败时不取消其它架构：能一眼区分「某架构特有问题」
      # 还是「全架构共性问题」。
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - armeabi-v7a
          - x86
          - x86_64
    steps:
      - name: 检出 main 主线
        uses: actions/checkout@v7
        with:
          ref: main

      - name: 设置 JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: 解码 JKS 到 app 目录
        run: |
          # app/build.gradle 中 storeFile 使用的是相对 app 模块目录的路径
          echo "$JKS_BASE64" | base64 -d > app/ki-terminal-release.jks
          test -s app/ki-terminal-release.jks
          echo "JKS 写入完成：$(stat -c%s app/ki-terminal-release.jks) 字节"

      - name: 编译 ${{ matrix.abi }} Release APK
        env:
          # 关键：TERMUX_WORKFLOW_CLI=false，否则会打 CLI 版本！
          TERMUX_WORKFLOW_CLI: "false"
          # 让产物重命名成 termux-app_<tag>_<abi>.apk
          TERMUX_APK_VERSION_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          ./gradlew :app:assembleRelease -Ptermux.abi=${{ matrix.abi }} --console=plain

      - name: 列出产物
        run: ls -lh app/build/outputs/apk/release/

      - name: 上传 ${{ matrix.abi }} 产物
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ matrix.abi }}
          archive: false
          if-no-files-found: error
          path: app/build/outputs/apk/release/*.apk

  # ── 3. universal 全架构整包（可选） ────────────────────────────────
  # 默认在「发布 Release」事件下仍然构建，保持与拆分前一致的产物集合；
  # 手动触发时由 inputs.build_universal 决定（默认 false，只想要分架构包时可省掉这趟）。
  build_universal:
    needs: preflight
    if: needs.preflight.outputs.skip == 'false' && (github.event_name == 'release' || inputs.build_universal == true)
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: 检出 main 主线
        uses: actions/checkout@v7
        with:
          ref: main

      - name: 设置 JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: 解码 JKS 到 app 目录
        run: |
          echo "$JKS_BASE64" | base64 -d > app/ki-terminal-release.jks
          test -s app/ki-terminal-release.jks
          echo "JKS 写入完成：$(stat -c%s app/ki-terminal-release.jks) 字节"

      - name: 编译 universal Release APK
        env:
          TERMUX_WORKFLOW_CLI: "false"
          TERMUX_APK_VERSION_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          # -Ptermux.abi=universal → 关闭 ABI 拆分，四个架构一起打进一个包
          ./gradlew :app:assembleRelease -Ptermux.abi=universal --console=plain

      - name: 列出产物
        run: ls -lh app/build/outputs/apk/release/

      - name: 上传 universal 产物
        uses: actions/upload-artifact@v7
        with:
          name: apk-universal
          archive: false
          if-no-files-found: error
          path: app/build/outputs/apk/release/*.apk

  # ── 4. 汇总上传到 Release ──────────────────────────────────────────
  publish:
    needs: [preflight, build, build_universal]
    # 预检未跳过、分架构全部成功、且 universal 未失败（被跳过不算失败）才发布，
    # 避免只上传了一半架构就发出去。
    if: always() && needs.preflight.outputs.skip == 'false' && needs.build.result == 'success' && (needs.build_universal.result == 'success' || needs.build_universal.result == 'skipped')
    runs-on: ubuntu-26.04
    steps:
      - name: 下载全部 APK 产物
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: 列出待上传文件
        run: ls -lh dist/

      - name: 上传 APK 到 Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.preflight.outputs.tag }}"
          upload_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}"
          # 从 API 拿 upload_url（带 ?name= 参数模板）
          upload_base=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "$upload_url" \
            | jq -r '.upload_url' | sed 's/{?name,label}//')
          echo "upload_base=$upload_base"

          shopt -s nullglob
          apks=(dist/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::dist/ 下没有任何 APK 产物，无法发布"
            exit 1
          fi

          for apk in "${apks[@]}"; do
            name=$(basename "$apk")
            size=$(stat -c%s "$apk")
            echo "上传 $name ($size bytes) ..."
            resp=$(curl -s -w "\nHTTP_CODE:%{http_code}" \
                     -H "Authorization: token $GITHUB_TOKEN" \
                     -H "Content-Type: application/vnd.android.package-archive" \
                     --data-binary @"$apk" \
                     "${upload_base}?name=${name}")
            body=$(echo "$resp" | sed '$d')
            http_code=$(echo "$resp" | tail -1 | sed 's/HTTP_CODE://')
            if [ "$http_code" = "201" ]; then
              url=$(echo "$body" | jq -r '.html_url // .url // empty')
              echo "✅ 上传成功: $url"
            else
              echo "❌ 上传失败 HTTP $http_code"
              echo "$body"
              exit 1
            fi
          done
