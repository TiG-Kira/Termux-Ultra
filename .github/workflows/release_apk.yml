name: 发布 APK 到 Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  JKS_BASE64: 

jobs:
  release-build:
    runs-on: ubuntu-26.04
    steps:
      - name: 检出 main 主线
        uses: actions/checkout@v7
        with:
          ref: main

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: 检查 Release 是否已附带 APK
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          api_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}"
          assets=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "$api_url" \
            | jq -r '.assets[]?.name' 2>/dev/null | grep -i '\.apk$' || true)
          if [ -n "$assets" ]; then
            echo "存在 APK assets:"
            echo "$assets"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release 中没有 APK，开始构建..."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 解码 JKS 到 app 目录
        if: steps.check.outputs.skip == 'false'
        run: |
          # app/build.gradle 中 storeFile 使用的是相对 app 模块目录的路径
          echo "$JKS_BASE64" | base64 -d > app/ki-terminal-release.jks
          test -s app/ki-terminal-release.jks
          echo "JKS 写入完成：$(stat -c%s app/ki-terminal-release.jks) 字节"

      - name: 编译 Release APK（拆架构）
        if: steps.check.outputs.skip == 'false'
        run: |
          # 关键：TERMUX_WORKFLOW_CLI=false，否则会打 CLI 版本！
          export TERMUX_WORKFLOW_CLI=false
          # 强制启用 ABI splits，产出 arm64-v8a / armeabi-v7a / x86 / x86_64 + universal
          export TERMUX_FORCE_SPLITS=1
          ./gradlew :app:assembleRelease

      - name: 收集产物
        if: steps.check.outputs.skip == 'false'
        id: collect
        run: |
          APK_DIR="app/build/outputs/apk/release"
          echo "APK 目录内容："
          ls -lh "$APK_DIR"
          # 列出所有产物路径供后续上传
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          find "$APK_DIR" -maxdepth 1 -name "*.apk" | sort >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: 上传 APK 到 Release
        if: steps.check.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          upload_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}"
          # 从 API 拿 upload_url（带 ?name= 参数模板）
          upload_base=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "$upload_url" \
            | jq -r '.upload_url' | sed 's/{?name,label}//')

          for apk in ${{ steps.collect.outputs.paths }}; do
            name=$(basename "$apk")
            echo "上传 $name ..."
            curl -s -H "Authorization: token $GITHUB_TOKEN" \
                 -H "Content-Type: application/vnd.android.package-archive" \
                 --data-binary @"$apk" \
                 "${upload_base}?name=${name}" \
              | jq -r '.html_url // .message // .url'
          done
