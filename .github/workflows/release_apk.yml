name: 发布 APK 到 Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要附加 APK 的 Release tag（workflow_dispatch 时必填；release 事件自动取触发 tag）"
        required: false
        type: string
      build_universal:
        description: "手动触发时是否额外构建 universal 全架构包（release 事件下始终构建）"
        required: false
        type: boolean
        default: false
  # repository_dispatch：由 release_tag.yml 在创建 Release 后显式触发（替代 workflow_dispatch + PAT）。
  # 使用 event_type=trigger-release-apk，tag/build_universal 通过 client_payload 传入。
  # 该 API 支持 GITHUB_TOKEN，不再依赖 secrets.PAT。
  repository_dispatch:
    types: [trigger-release-apk]

# 同一 tag 的发布构建串行化：不取消进行中的运行，避免构建到一半被打断、
# 结果 Release 上只挂了一半架构的包。
concurrency:
  group: release-apk-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

# 【安全】签名材料全部从 Secrets 注入，本文件不得出现任何明文。
# 放在作业级而不是 workflow 级 env，是为了把可见范围限制在真正需要签名的
# 两个构建作业上 —— preflight / 上传 Release 资产等作业拿不到签名材料。
#
# 需要的仓库 Secrets：
#   JKS_BASE64                    release 私钥库的 base64（必填）
#   KI_TERMINAL_STORE_PASSWORD    keystore 口令（必填）
#   KI_TERMINAL_KEY_PASSWORD      私钥口令（必填）
#   KI_TERMINAL_KEY_ALIAS         alias，缺省回落到 ki-terminal（可选）
# 口令取值与环境变量的对应关系见 app/build.gradle 的 signingConfigs.release。
env:
  # AgentPaw 依赖走 GitHub Packages（公开包也要 token），gradle 仓库源读取该变量
  GITHUB_PACKAGES_TOKEN: ${{ github.token }}

jobs:
  # ── 1. 预检：Release 里是否已经有 APK ───────────────────────────────
  # 拆成独立作业后这个 API 调用只做一次，后续所有构建作业都看它的输出决定是否跳过。
  preflight:
    runs-on: ubuntu-26.04
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      skip: ${{ steps.check.outputs.skip }}
      build_universal: ${{ steps.check.outputs.build_universal }}
    steps:
      - name: 检查 Release 是否已附带 APK
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 三种触发源的 tag 取值优先级：
          #   1. repository_dispatch → client_payload.tag
          #   2. release             → github.event.release.tag_name
          #   3. workflow_dispatch   → inputs.tag
          tag="${{ github.event.client_payload.tag || github.event.release.tag_name || inputs.tag }}"
          # build_universal：release 事件始终构建；dispatch 事件由传入决定；手动默认 false
          if [ "${{ github.event_name }}" = "release" ]; then
            build_universal=true
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            build_universal="${{ github.event.client_payload.build_universal || true }}"
          else
            build_universal="${{ inputs.build_universal || false }}"
          fi
          if [ -z "$tag" ]; then
            echo "::error::无法确定 tag：release 事件的 tag_name、workflow_dispatch 的 inputs.tag、repository_dispatch 的 client_payload.tag 都为空"
            exit 1
          fi
          echo "目标 tag: $tag  build_universal: $build_universal  触发源: ${{ github.event_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build_universal=$build_universal" >> "$GITHUB_OUTPUT"
          api_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}"
          assets=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "$api_url" \
            | jq -r '.assets[]?.name' 2>/dev/null | grep -i '\.apk$' || true)
          if [ -n "$assets" ]; then
            echo "存在 APK assets:"
            echo "$assets"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release 中没有 APK，开始构建..."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  # ── 2. 按架构并行构建 ─────────────────────────────────────────────
  # 每个 ABI 一个独立作业：CMake 只为该 ABI 配置与编译，四项原生构建互不干扰，
  # 单作业的内存峰值约 1/4、墙钟时间也降到 1/4 左右；4 个 APK 同时产出。
  # -Ptermux.abi=<abi> 只影响本作业，产物保持 AGP 默认命名 app-<abi>-release.apk。
  #
  # 编译逻辑（缓存 + 增量优先 + 全量降级重试 + 失败判定）收敛到
  # ./.github/actions/gradle-build，与 ci.yml 共用同一份实现。
  build:
    needs: preflight
    if: needs.preflight.outputs.skip == 'false'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      # 仅本作业可见（见文件头的说明）：preflight / upload 作业拿不到签名材料。
      JKS_BASE64: ${{ secrets.JKS_BASE64 }}
      KI_TERMINAL_STORE_PASSWORD: ${{ secrets.KI_TERMINAL_STORE_PASSWORD }}
      KI_TERMINAL_KEY_PASSWORD: ${{ secrets.KI_TERMINAL_KEY_PASSWORD }}
      KI_TERMINAL_KEY_ALIAS: ${{ secrets.KI_TERMINAL_KEY_ALIAS }}
    strategy:
      # 某一架构编译失败时不取消其它架构：能一眼区分「某架构特有问题」
      # 还是「全架构共性问题」。
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - armeabi-v7a
          - x86
          - x86_64
    steps:
      - name: 检出 main 主线
        uses: actions/checkout@v7
        with:
          ref: main

      - name: 设置 JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          # 刻意不启用 cache: gradle —— 它内部走 actions/cache，PR 上会无条件
          # 回写并挤占主线缓存配额；且 ~/.gradle 已由 gradle-build action 完整
          # 覆盖，留着属重复覆盖。详见 .github/actions/gradle-build/action.yml

      - name: 解码 JKS 到 app 目录
        run: |
          # app/build.gradle 中 storeFile 使用的是相对 app 模块目录的路径
          echo "$JKS_BASE64" | base64 -d > app/ki-terminal-release.jks
          test -s app/ki-terminal-release.jks
          echo "JKS 写入完成：$(stat -c%s app/ki-terminal-release.jks) 字节"

      # 签名配置（signingConfigs.release / buildTypes.release.signingConfig）
      # 仍由 app/build.gradle 读取上面解码出的 JKS，此处逻辑未做任何改动。
      # 关键：TERMUX_WORKFLOW_CLI=false，否则会打 CLI 版本！
      - name: 编译 ${{ matrix.abi }} Release APK（增量优先，失败自动全量重试一次）
        uses: ./.github/actions/gradle-build
        with:
          gradle-task: ':app:assembleRelease'
          variant: release
          abi: ${{ matrix.abi }}
          termux-workflow-cli: 'false'
          artifact-glob: 'app/build/outputs/apk/release/*.apk'

      # 体积优化流程已取消（收益有限且拖慢构建）：直接采用 Gradle 已签名产物上传。

      - name: 列出产物
        run: ls -lh app/build/outputs/apk/release/

      - name: 上传 ${{ matrix.abi }} 产物
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ matrix.abi }}
          archive: false
          if-no-files-found: error
          path: app/build/outputs/apk/release/*.apk

  # ── 3. universal 全架构整包（可选） ────────────────────────────────
  # 默认在「发布 Release」事件下仍然构建，保持与拆分前一致的产物集合；
  # 手动触发时由 inputs.build_universal 决定（默认 false，只想要分架构包时可省掉这趟）。
  build_universal:
    needs: preflight
    # 优先以 preflight 计算出的 build_universal 标志为准，兼容三种触发源。
    if: needs.preflight.outputs.skip == 'false' && needs.preflight.outputs.build_universal == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      # 同上：签名材料只注入真正需要它的构建作业。
      JKS_BASE64: ${{ secrets.JKS_BASE64 }}
      KI_TERMINAL_STORE_PASSWORD: ${{ secrets.KI_TERMINAL_STORE_PASSWORD }}
      KI_TERMINAL_KEY_PASSWORD: ${{ secrets.KI_TERMINAL_KEY_PASSWORD }}
      KI_TERMINAL_KEY_ALIAS: ${{ secrets.KI_TERMINAL_KEY_ALIAS }}
    steps:
      - name: 检出 main 主线
        uses: actions/checkout@v7
        with:
          ref: main

      - name: 设置 JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          # 刻意不启用 cache: gradle —— 它内部走 actions/cache，PR 上会无条件
          # 回写并挤占主线缓存配额；且 ~/.gradle 已由 gradle-build action 完整
          # 覆盖，留着属重复覆盖。详见 .github/actions/gradle-build/action.yml

      - name: 解码 JKS 到 app 目录
        run: |
          echo "$JKS_BASE64" | base64 -d > app/ki-terminal-release.jks
          test -s app/ki-terminal-release.jks
          echo "JKS 写入完成：$(stat -c%s app/ki-terminal-release.jks) 字节"

      - name: 编译 universal Release APK（增量优先，失败自动全量重试一次）
        uses: ./.github/actions/gradle-build
        with:
          gradle-task: ':app:assembleRelease'
          variant: release
          # -Ptermux.abi=universal → 关闭 ABI 拆分，四个架构一起打进一个包。
          # 独立缓存段：与四个单架构作业互不覆盖，各自复用各自的历史产物。
          abi: universal
          termux-workflow-cli: 'false'
          artifact-glob: 'app/build/outputs/apk/release/*.apk'

      # 体积优化流程已取消（收益有限且拖慢构建）：直接采用 Gradle 已签名产物上传。

      - name: 列出产物
        run: ls -lh app/build/outputs/apk/release/

      - name: 上传 universal 产物
        uses: actions/upload-artifact@v7
        with:
          name: apk-universal
          archive: false
          if-no-files-found: error
          path: app/build/outputs/apk/release/*.apk

  # ── 4. 汇总上传到 Release ──────────────────────────────────────────
  publish:
    needs: [preflight, build, build_universal]
    # 预检未跳过、分架构全部成功、且 universal 未失败（被跳过不算失败）才发布，
    # 避免只上传了一半架构就发出去。
    if: always() && needs.preflight.outputs.skip == 'false' && needs.build.result == 'success' && (needs.build_universal.result == 'success' || needs.build_universal.result == 'skipped')
    runs-on: ubuntu-26.04
    steps:
      - name: 下载全部 APK 产物
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: 列出待上传文件
        run: ls -lh dist/

      - name: 上传 APK 到 Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.preflight.outputs.tag }}"
          upload_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}"
          # 从 API 拿 upload_url（带 ?name= 参数模板）
          upload_base=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "$upload_url" \
            | jq -r '.upload_url' | sed 's/{?name,label}//')
          echo "upload_base=$upload_base"

          shopt -s nullglob
          apks=(dist/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::dist/ 下没有任何 APK 产物，无法发布"
            exit 1
          fi

          for apk in "${apks[@]}"; do
            name=$(basename "$apk")
            size=$(stat -c%s "$apk")
            echo "上传 $name ($size bytes) ..."
            resp=$(curl -s -w "\nHTTP_CODE:%{http_code}" \
                     -H "Authorization: token $GITHUB_TOKEN" \
                     -H "Content-Type: application/vnd.android.package-archive" \
                     --data-binary @"$apk" \
                     "${upload_base}?name=${name}")
            body=$(echo "$resp" | sed '$d')
            http_code=$(echo "$resp" | tail -1 | sed 's/HTTP_CODE://')
            if [ "$http_code" = "201" ]; then
              url=$(echo "$body" | jq -r '.html_url // .url // empty')
              echo "✅ 上传成功: $url"
            else
              echo "❌ 上传失败 HTTP $http_code"
              echo "$body"
              exit 1
            fi
          done
