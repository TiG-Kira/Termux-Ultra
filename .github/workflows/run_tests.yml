name: 单元测试

# 独立工作流（不再塞进 ci.yml）：ci.yml 只跑 `:app:assembleDebug`，
# 既不编译也不执行任何单元测试，导致 app/src/test、terminal-emulator/src/test
# 下的测试长期处于「零验证」状态（含 test-only 依赖升级、Robolectric 配置等改动）。
# 本工作流负责把各模块的 JVM 单元测试真正跑起来。
on:
  push:
    branches:
      - main
    # 纯文档改动（README / docs 站点）不值得占用测试资源。
    # 注意：若将来给本工作流开启「必需状态检查（required status check）」，
    # docs-only 的 PR 不会产生这个 check，会被永久卡在 pending，届时需去掉 paths-ignore。
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testing:
    name: "Unit tests"
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # 注：ci.yml 目前仍固定 setup-java@v4（GitHub 已标记弃用，runner 上被强制跑在 Node 24），
      # 这里直接用 v6，免得新工作流一出生就带弃用警告；后续可把 ci.yml 一并升上来。
      - name: 设置 JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # ./gradlew test 会执行各子模块的单元测试任务：
      #   :app:testDebugUnitTest（JUnit4 + Robolectric 4.17）
      #   :terminal-emulator / :termux-shared / :terminal-view / :libterminal
      #   以及 vendor/termux-addons 下的 :termux-api / :termux-styling / :termux-tasker / :termux-widget
      # TERMUX_WORKFLOW_CLI 与 ci.yml 保持一致，保证测试跑在和「编译」相同的构建配置上。
      - name: 运行单元测试
        run: |
          export TERMUX_WORKFLOW_CLI=true
          ./gradlew test

      # 让「测试到底跑了多少」在 CI 摘要里直接可见，避免 test 任务其实是 NO-SOURCE
      # （没有任何测试源）却一路绿灯。
      - name: 汇总测试结果
        if: always()
        run: |
          set +e
          xmls=()
          while IFS= read -r f; do xmls+=("$f"); done < <(find . -path '*/build/test-results/*' -name 'TEST-*.xml' | sort)
          if [ ${#xmls[@]} -eq 0 ]; then
            echo "⚠️ 未找到任何测试结果文件：test 任务很可能是 NO-SOURCE（没有测试源）。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### 单元测试结果"
            echo ""
            echo "结果文件：${#xmls[@]} 个"
            echo ""
            awk '
              match($0, /tests="[0-9]+"/)    { n=substr($0,RSTART+7,RLENGTH-8);   t+=n }
              match($0, /failures="[0-9]+"/) { n=substr($0,RSTART+10,RLENGTH-11); f+=n }
              match($0, /errors="[0-9]+"/)   { n=substr($0,RSTART+8,RLENGTH-9);   e+=n }
              match($0, /skipped="[0-9]+"/)  { n=substr($0,RSTART+9,RLENGTH-10);  s+=n }
              END { printf "| 用例 | 失败 | 错误 | 跳过 |\n|---|---|---|---|\n| %d | %d | %d | %d |\n", t, f, e, s }
            ' "${xmls[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          if-no-files-found: ignore
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
