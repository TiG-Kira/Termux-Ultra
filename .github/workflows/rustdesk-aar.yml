name: Build RustDesk AAR

# 把上游 RustDesk 的 Android 端编成可被本应用内嵌的 AAR。
#
# 上游 Android 产物只有 APK（flutter/android/app 是 com.android.application），所以流程是：
# 先按上游配方编一次 release APK 拿到完整产物，再用仓库内预置的 rustdesk-library.patch
# 把上游模块改造成 library 出 AAR（patch 等价于原 patch_android_library.py 的改造，但改为
# 可审查的统一 diff，随本仓库版本化、对齐上游 tag），最后用 APK 里的原生库补齐 AAR
#（library 变体不带 Flutter 引擎）。
#
# 构建依赖的版本全部对齐上游 .github/workflows/flutter-build.yml 与 bridge.yml，
# 改任何一个都要同步上游，否则桥代码与 Dart 侧的 freezed 输出对不上。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: RustDesk 上游 tag
        required: true
        default: "1.5.1"
      abi:
        description: 目标 ABI
        required: true
        type: choice
        default: arm64-v8a
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64

permissions:
  contents: read

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  CARGO_NDK_VERSION: "3.1.2"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  NDK_VERSION: "r28c"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  RUSTDESK_TAG: ${{ inputs.tag }}
  ABI: ${{ inputs.abi }}

jobs:
  build-aar:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout host repo
        uses: actions/checkout@v4
        with:
          path: host

      - name: Checkout RustDesk
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: ${{ inputs.tag }}
          path: rustdesk
          submodules: recursive
          fetch-depth: 1

      - name: Export Actions cache env
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake curl gcc g++ gcc-multilib g++-multilib git libc6-dev \
            libclang-dev llvm-dev nasm ninja-build pkg-config wget \
            openjdk-17-jdk-headless

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rustdesk-aar
          key: ${{ inputs.abi }}

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: /opt/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Verify Flutter engine matches host pin
        working-directory: host
        run: |
          EXPECTED=$(sed -n 's/^rustdesk\.flutterEngine=//p' gradle.properties | tr -d '\r')
          ACTUAL=$(tr -d '\r\n' < "${FLUTTER_ROOT}/bin/internal/engine.version")
          echo "gradle.properties : ${EXPECTED}"
          echo "flutter sdk       : ${ACTUAL}"
          test -n "${EXPECTED}" || { echo "gradle.properties 缺少 rustdesk.flutterEngine"; exit 1; }
          if [ "${EXPECTED}" != "${ACTUAL}" ]; then
            echo "引擎版本不一致：libapp.so 由 ${ACTUAL} 编出，宿主按 ${EXPECTED} 取引擎，运行时必崩（黑屏）"
            exit 1
          fi

      - name: Install cargo tools
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features uuid --locked

      - name: Generate flutter_rust_bridge code
        working-directory: rustdesk
        run: |
          cd flutter && flutter pub get && cd ..
          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Build vcpkg dependencies
        working-directory: rustdesk
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          if ! ./flutter/build_android_deps.sh "${ABI}"; then
            find "${VCPKG_ROOT}" -name '*.log' -exec sh -c 'echo "===== $1"; cat "$1"' _ {} \;
            exit 1
          fi

      - name: Build rust core
        working-directory: rustdesk
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          case "${ABI}" in
            arm64-v8a)  TARGET=aarch64-linux-android;    SCRIPT=./flutter/ndk_arm64.sh; LIBCXX=aarch64-linux-android ;;
            armeabi-v7a) TARGET=armv7-linux-androideabi; SCRIPT=./flutter/ndk_arm.sh;  LIBCXX=arm-linux-androideabi ;;
            x86_64)     TARGET=x86_64-linux-android;     SCRIPT=./flutter/ndk_x64.sh;  LIBCXX=x86_64-linux-android ;;
            *) echo "unsupported abi: ${ABI}"; exit 1 ;;
          esac
          # hwcodec 的 build.rs 用 bindgen 解析 C 头文件。cargo-ndk 会把 target 传给 libclang，
          # 但不给 sysroot，libclang 就退回宿主 /usr/include；glibc 的 stdint.h 在非本机 triple
          # 下又找不到 multiarch 的 bits/libc-header-start.h，构建直接失败。显式给 NDK sysroot。
          SYSROOT="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          export BINDGEN_EXTRA_CLANG_ARGS="--target=${TARGET}21 --sysroot=${SYSROOT}"
          rustup target add "${TARGET}"
          "${SCRIPT}"
          mkdir -p "flutter/android/app/src/main/jniLibs/${ABI}"
          SOURCE=$(find "target/${TARGET}/release" -maxdepth 1 -name '*librustdesk.so' | head -1)
          test -n "${SOURCE}" || { echo "no librustdesk.so produced"; exit 1; }
          cp "${SOURCE}" "flutter/android/app/src/main/jniLibs/${ABI}/librustdesk.so"
          cp "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/${LIBCXX}/libc++_shared.so" \
             "flutter/android/app/src/main/jniLibs/${ABI}/"

      - name: Build reference APK
        working-directory: rustdesk
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          # 参考 APK 只用来取 libapp.so 与 flutter_assets，不对外发布，所以两处都为「编得过」让步：
          # 1) 没有上游 key.properties，release 签名配置会让 AGP 直接失败，换成 debug 签名；
          # 2) RustDesk 全量代码在 runner 上走 R8 会 OutOfMemoryError（minifyReleaseWithR8
          #    直接 Java heap space），关掉压缩不影响 AOT 快照与资源产物。
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          sed -i "s|^\(\s*\)signingConfig signingConfigs.debug\s*$|\1signingConfig signingConfigs.debug\n\1minifyEnabled false\n\1shrinkResources false|" \
            ./flutter/android/app/build.gradle
          grep -q "minifyEnabled false" ./flutter/android/app/build.gradle || {
            echo "failed to disable R8 for reference APK"; exit 1; }
          # 上游若已设过 jvmargs，直接替换而非跳过，否则 4G 堆会被原样保留
          if grep -q "^org.gradle.jvmargs" flutter/android/gradle.properties 2>/dev/null; then
            sed -i "s|^org.gradle.jvmargs=.*|org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g|" \
              flutter/android/gradle.properties
          else
            echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g" >> flutter/android/gradle.properties
          fi
          PLATFORM=android-arm64
          [ "${ABI}" = "armeabi-v7a" ] && PLATFORM=android-arm
          cd flutter && flutter build apk --release --target-platform "${PLATFORM}" --split-per-abi

      - name: Apply library patch
        working-directory: rustdesk
        run: git apply --ignore-whitespace ../host/tools/rustdesk-vendor/rustdesk-library.patch

      - name: Build AAR
        working-directory: rustdesk/flutter/android
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          # wrapper 由上一步的 flutter build 生成；library 变体走 assembleRelease 出 .aar
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Merge Dart artifacts into AAR
        working-directory: rustdesk
        run: |
          python3 ../host/tools/rustdesk-vendor/merge_aar.py \
            --aar "flutter/android/app/build/outputs/aar/app-release.aar" \
            --apk "$(find flutter/build/app/outputs/flutter-apk -name '*-release.apk' | head -1)" \
            --abi "${ABI}" \
            --output ../rustdesk-release.aar

      - name: Inspect AAR
        run: |
          unzip -l rustdesk-release.aar | head -40
          du -h rustdesk-release.aar

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-${{ inputs.abi }}-${{ inputs.tag }}
          path: rustdesk-release.aar
          if-no-files-found: error
