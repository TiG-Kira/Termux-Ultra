name: Build RustDesk AAR

# 把上游 RustDesk 的 Android 端编成可被本应用内嵌的 AAR。
#
# 上游 Android 端是 com.android.application，且 flutter build aar 只接受 module 项目（application
# 会被直接拒绝：AARs can only be built from modules）。故流程：仓库内预置的 rustdesk-library.patch
# 把上游模块改造成 com.android.library，再用 gradle :app:assembleRelease 直接出 AAR（library 变体以
# classes.jar 而非 dex 交付，不做 mergeExtDex，正好绕开之前整包 APK 的 OOM）。上游不提交 gradlew
# （gitignored），本工作流从 Flutter SDK 自带的 gradle_wrapper 复制回来驱动 gradle。AAR 内自带
# Dart AOT（libapp.so）、flutter_assets 与编译后的 Kotlin 类，librustdesk.so 由「Build rust core」
# 步骤 cp 进 jniLibs；Flutter 引擎（libflutter.so）不进 AAR，由宿主 maven 提供。
#
# 构建依赖的版本全部对齐上游 .github/workflows/flutter-build.yml 与 bridge.yml，
# 改任何一个都要同步上游，否则桥代码与 Dart 侧的 freezed 输出对不上。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: RustDesk 上游 tag
        required: true
        default: "1.5.1"
      abi:
        description: 目标 ABI
        required: true
        type: choice
        default: arm64-v8a
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64

permissions:
  contents: read

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  CARGO_NDK_VERSION: "3.1.2"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  NDK_VERSION: "r28c"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  RUSTDESK_TAG: ${{ inputs.tag }}
  ABI: ${{ inputs.abi }}

jobs:
  build-aar:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout host repo
        uses: actions/checkout@v4
        with:
          path: host

      - name: Checkout RustDesk
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: ${{ inputs.tag }}
          path: rustdesk
          submodules: recursive
          fetch-depth: 1

      - name: Export Actions cache env
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake curl gcc g++ gcc-multilib g++-multilib git libc6-dev \
            libclang-dev llvm-dev nasm ninja-build pkg-config wget \
            openjdk-17-jdk-headless

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rustdesk-aar
          key: ${{ inputs.abi }}

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: /opt/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Verify Flutter engine matches host pin
        working-directory: host
        run: |
          EXPECTED=$(sed -n 's/^rustdesk\.flutterEngine=//p' gradle.properties | tr -d '\r')
          ACTUAL=$(tr -d '\r\n' < "${FLUTTER_ROOT}/bin/internal/engine.version")
          echo "gradle.properties : ${EXPECTED}"
          echo "flutter sdk       : ${ACTUAL}"
          test -n "${EXPECTED}" || { echo "gradle.properties 缺少 rustdesk.flutterEngine"; exit 1; }
          if [ "${EXPECTED}" != "${ACTUAL}" ]; then
            echo "引擎版本不一致：libapp.so 由 ${ACTUAL} 编出，宿主按 ${EXPECTED} 取引擎，运行时必崩（黑屏）"
            exit 1
          fi

      - name: Install cargo tools
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features uuid --locked

      - name: Generate flutter_rust_bridge code
        working-directory: rustdesk
        run: |
          cd flutter && flutter pub get && cd ..
          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Build vcpkg dependencies
        working-directory: rustdesk
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          if ! ./flutter/build_android_deps.sh "${ABI}"; then
            find "${VCPKG_ROOT}" -name '*.log' -exec sh -c 'echo "===== $1"; cat "$1"' _ {} \;
            exit 1
          fi

      - name: Build rust core
        working-directory: rustdesk
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          case "${ABI}" in
            arm64-v8a)  TARGET=aarch64-linux-android;    SCRIPT=./flutter/ndk_arm64.sh; LIBCXX=aarch64-linux-android ;;
            armeabi-v7a) TARGET=armv7-linux-androideabi; SCRIPT=./flutter/ndk_arm.sh;  LIBCXX=arm-linux-androideabi ;;
            x86_64)     TARGET=x86_64-linux-android;     SCRIPT=./flutter/ndk_x64.sh;  LIBCXX=x86_64-linux-android ;;
            *) echo "unsupported abi: ${ABI}"; exit 1 ;;
          esac
          # hwcodec 的 build.rs 用 bindgen 解析 C 头文件。cargo-ndk 会把 target 传给 libclang，
          # 但不给 sysroot，libclang 就退回宿主 /usr/include；glibc 的 stdint.h 在非本机 triple
          # 下又找不到 multiarch 的 bits/libc-header-start.h，构建直接失败。显式给 NDK sysroot。
          SYSROOT="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          export BINDGEN_EXTRA_CLANG_ARGS="--target=${TARGET}21 --sysroot=${SYSROOT}"
          rustup target add "${TARGET}"
          "${SCRIPT}"
          mkdir -p "flutter/android/app/src/main/jniLibs/${ABI}"
          SOURCE=$(find "target/${TARGET}/release" -maxdepth 1 -name '*librustdesk.so' | head -1)
          test -n "${SOURCE}" || { echo "no librustdesk.so produced"; exit 1; }
          cp "${SOURCE}" "flutter/android/app/src/main/jniLibs/${ABI}/librustdesk.so"
          cp "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/${LIBCXX}/libc++_shared.so" \
             "flutter/android/app/src/main/jniLibs/${ABI}/"

      - name: Apply library patch
        working-directory: rustdesk
        run: git apply --ignore-whitespace ../host/tools/rustdesk-vendor/rustdesk-library.patch

      - name: Build AAR (library assembleRelease)
        working-directory: rustdesk/flutter
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          # 上游 flutter/android 不提交 gradle wrapper（gitignored）。flutter pub get 会生成 gradlew
          # 脚本与 gradle-wrapper.properties，但**不会**生成 gradle-wrapper.jar（它本应随源码提交）。
          # 缺 jar 时 ./gradlew 直接报 ClassNotFoundException: GradleWrapperMain。所以必须从 Flutter
          # SDK 自带的一份把 jar 补回 android/gradle/wrapper/。
          FLUTTER_ROOT="$(dirname "$(dirname "$(readlink -f "$(which flutter)")")")"
          echo "FLUTTER_ROOT=${FLUTTER_ROOT}"
          JAR="$(find "${FLUTTER_ROOT}" -name 'gradle-wrapper.jar' 2>/dev/null | head -1)"
          echo "gradle-wrapper.jar = ${JAR}"
          test -n "${JAR}" || { echo "找不到 gradle-wrapper.jar"; exit 1; }
          # 先把 jar 放好（pub get 前放也无害，pub get 不会删除已存在的 jar）
          mkdir -p android/gradle/wrapper
          cp "${JAR}" android/gradle/wrapper/gradle-wrapper.jar
          # 若 flutter pub get 仍未产出 gradlew 脚本，也从 SDK 复制
          if [ ! -f android/gradlew ]; then
            GW_SCRIPT="$(find "${FLUTTER_ROOT}" -name 'gradlew' 2>/dev/null | head -1)"
            if [ -n "${GW_SCRIPT}" ]; then
              cp "${GW_SCRIPT}" android/gradlew
              chmod +x android/gradlew
            fi
          fi
          # 已经 library patch 改造为 com.android.library，直接 assembleRelease 出 AAR：
          # 内含 classes.jar(MainActivity/RustDeskHostBridge/ffi 等) + libapp.so(Dart AOT)
          # + flutter_assets + 我们 cp 进 jniLibs 的 librustdesk.so/c++_shared.so。
          # library 变体以 classes.jar 而非 dex 交付，不做 mergeExtDex，正好绕开之前整包 APK 的 OOM。
          # 引擎 libflutter.so 不进 AAR，由宿主从 maven 依赖。
          flutter pub get
          # 保险：pub get 之后再次确认 jar 就位（防止任何环节被覆盖）
          cp "${JAR}" android/gradle/wrapper/gradle-wrapper.jar
          test -f android/gradlew || { echo "gradlew 仍未就位"; exit 1; }
          test -f android/gradle/wrapper/gradle-wrapper.jar || { echo "jar 仍未就位"; exit 1; }
          cd android
          ./gradlew :app:assembleRelease --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            -Dorg.gradle.workers.max=2

      - name: Verify & repackage AAR
        working-directory: rustdesk
        run: |
          AAR="flutter/android/app/build/outputs/aar/app-release.aar"
          test -f "${AAR}" || { echo "assembleRelease 未产出 AAR：${AAR}"; exit 1; }
          python3 ../host/tools/rustdesk-vendor/merge_aar.py \
            --aar "${AAR}" \
            --abi "${ABI}" \
            --output ../rustdesk-release.aar

      - name: Inspect AAR
        run: |
          unzip -l rustdesk-release.aar | head -40
          du -h rustdesk-release.aar

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-${{ inputs.abi }}-${{ inputs.tag }}
          path: rustdesk-release.aar
          if-no-files-found: error
