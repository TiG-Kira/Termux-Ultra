plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.plugin.compose" version "2.4.20"
    id "org.jetbrains.kotlin.plugin.serialization" version "2.4.20"
    id "com.google.devtools.ksp" version "2.3.12"
    id "kotlin-parcelize"
}

configurations.all {
    resolutionStrategy {
        force "top.yukonga.miuix.kmp:miuix-ui-android:0.9.4"
    }
}

android {
    namespace "com.termux"
    compileSdkVersion project.properties.compileSdkVersion.toInteger()
    ndkVersion = System.getenv("JITPACK_NDK_VERSION") ?: project.properties.ndkVersion
    def appVersionName = System.getenv("TERMUX_APP_VERSION_NAME") ?: ""
    def splitAPKsForDebugBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS") ?: "1"
    def workflowCliBuild = System.getenv("TERMUX_WORKFLOW_CLI") == "true"
    def splitAPKsForReleaseBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS") ?: "0"

    // R8 代码收缩 / 资源收缩开关。
    // 默认关闭 —— 开启后 R8 会删除「无静态引用」的类、方法与资源，而本项目存在
    // Gson 反射字段、Class.forName、getDeclaredField、JNI 等动态引用点，
    // 必须先在真机上完整回归一遍（尤其 AI/插件/终端/下载几条链路）再考虑默认启用。
    // 启用方式：./gradlew assembleRelease -Ptermux.enableR8=true
    //（CI 可设环境变量 TERMUX_ENABLE_R8=true）
    // keep 规则已整理在 app/proguard-rules.pro，开启前请先读该文件顶部说明。
    def enableR8 = (project.findProperty("termux.enableR8")
        ?: System.getenv("TERMUX_ENABLE_R8")
        ?: "false").toString().toBoolean()

    // ── 单架构构建开关 ─────────────────────────────────────────────────
    // 用途：把「一次编译四个 ABI」拆成「一个 ABI 一次编译」，用于 CI 矩阵并行构建，
    //       既缩短单作业耗时，也把每个作业的 CMake / dex 内存峰值压到 1/4。
    //
    // 用法：./gradlew :app:assembleRelease -Ptermux.abi=arm64-v8a
    //      环境变量等价写法：TERMUX_ABI=arm64-v8a ./gradlew :app:assembleRelease
    //
    // 取值：
    //   arm64-v8a / armeabi-v7a / x86 / x86_64 —— 只编译并打包该架构（产物
    //       app-<abi>-<buildType>.apk，不含 universal 包）；
    //   universal —— 关闭 ABI 拆分，把全部架构打进一个包（app-<buildType>.apk）。
    //
    // 不指定时保持原行为：release 拆四架构 + universal，debug 打整包
    // （CI 仍可用 TERMUX_FORCE_SPLITS=1 强制 debug 也拆）。
    def supportedAbis = ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64']
    def targetAbi = (project.findProperty("termux.abi") ?: System.getenv("TERMUX_ABI") ?: "").toString().trim()
    if (targetAbi && targetAbi != "universal" && !supportedAbis.contains(targetAbi)) {
        throw new GradleException(
            "不支持的 -Ptermux.abi 取值：'${targetAbi}'；可用：${supportedAbis.join(' / ')} / universal")
    }
    // 是否「只编一个架构」；universal 是显式的反例（要全架构，但不拆分）
    def singleAbiBuild = targetAbi && targetAbi != "universal"

    defaultConfig {
        applicationId "com.termux"
        minSdkVersion project.properties.minSdkVersion.toInteger()
        targetSdkVersion project.properties.targetSdkVersion.toInteger()
        versionCode 1314
        versionName "2.3.4.R6"
        // Termux 核心版本号（基于的上游 Termux 版本）
        // 注意：termux_core_version 字符串已在 strings.xml 中定义
        buildConfigField "String", "TERMUX_CORE_VERSION", "\"0.119.0\""

        // 新星引擎 (LibTerminal) 核心版本号
        buildConfigField "String", "LIBTERMINAL_VERSION", "\"3.1.1\""

        // Workflow CLI build flag (set by GitHub Actions)
        buildConfigField "boolean", "WORKFLOW_CLI", "${workflowCliBuild}"

        if (appVersionName) versionName = appVersionName
        if (workflowCliBuild) versionName = "${versionName}-CLI"

        // 语言资源白名单：只保留中/英文，剔除 appcompat / material / androidx 等依赖自带的
        // 数十种语言资源（每种都会占用 resources.arsc 与 res/ 空间）。
        // 注意：新增界面语言时必须同步追加到此处，否则该语言会回退到默认（英文）。
        // ⚠️ AGP 9.x 的 resConfigs 按「完整限定符」匹配，"zh" 只匹配 values-zh，
        //    不会带上 values-zh-rCN —— 必须把 zh-rCN 显式列出，否则整个中文目录被
        //    过滤掉，应用在任何 locale 下都只会显示英文（PR #128 引入的回归，实测）。
        resConfigs "en", "zh", "zh-rCN"

        manifestPlaceholders.TERMUX_PACKAGE_NAME = "com.termux"
        manifestPlaceholders.TERMUX_APP_NAME = "Termux Ultra"
        manifestPlaceholders.TERMUX_API_APP_NAME = "Termux:API"
        manifestPlaceholders.TERMUX_BOOT_APP_NAME = "Termux:Boot"
        manifestPlaceholders.TERMUX_FLOAT_APP_NAME = "Termux:Float"
        manifestPlaceholders.TERMUX_STYLING_APP_NAME = "Termux:Styling"
        manifestPlaceholders.TERMUX_TASKER_APP_NAME = "Termux:Tasker"
        manifestPlaceholders.TERMUX_WIDGET_APP_NAME = "Termux:Widget"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=none"
                targets "native-vnc", "vncclient", "turbojpeg-static", "wolfssl", "termux-bootstrap"
            }
        }

        // 单架构构建**不要**在这里写 ndk.abiFilters —— AGP 明确禁止它与
        // splits.abi 同时出现，配置期就会抛：
        //     Conflicting configuration : 'arm64-v8a' in ndk abiFilters cannot be
        //     present when splits abi filters are set : arm64-v8a
        // （这是 CI 用 PR #128 跑出来的，本机没有 AGP 环境所以验不出来。）
        // 好在只设 splits.abi 就够了：AGP 会按 splits 列表决定要配置/编译哪些 ABI
        // （CMake 任务本身是按 ABI 拆的），所以只列一个 ABI 时原生编译也只跑这一个。
    }

    signingConfigs {
        release {
            storeFile file("ki-terminal-release.jks")
            storePassword "ki-terminal"
            keyAlias "ki-terminal"
            keyPassword "ki-terminal"
        }
    }

    // ABI 拆分策略（放在 android 顶层：splits 是 android 扩展的属性）：
    //   - 指定单个架构（-Ptermux.abi=arm64-v8a）→ 拆分开启，只含该架构，无 universal；
    //   - 指定 universal（-Ptermux.abi=universal）→ 拆分关闭，全部架构打进一个包；
    //   - 未指定 → release 拆四架构 + universal；debug 打整包（可用 TERMUX_FORCE_SPLITS=1 强制拆）。
    def forceSplits = System.getenv("TERMUX_FORCE_SPLITS") == "1"
    def isReleaseBuild = gradle.startParameter.taskNames.any {
        it.toLowerCase().contains('release')
    }
    splits {
        abi {
            enable singleAbiBuild ? true : ((!targetAbi) && (isReleaseBuild || forceSplits))
            reset ()
            if (singleAbiBuild) {
                include targetAbi
            } else {
                include 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
            }
            // 单架构构建没有「全架构包」的概念，避免产出误导性的 app-universal-*.apk
            universalApk !singleAbiBuild
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    buildTypes {
        release {
            minifyEnabled enableR8
            shrinkResources enableR8
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        compose true
        dataBinding = true
        buildConfig = true
    }

    composeOptions {
        kotlinCompilerExtensionVersion "1.5.14"
    }

    externalNativeBuild {
        cmake {
            version = "3.22.1"
            path file("CMakeLists.txt")
        }
    }

    packaging {
        // ⚠️ 不要改成 false / 不要设 extractNativeLibs="false"
        // Termux 的 bootstrap 以 libtermux-bootstrap.so 形式打包，运行时由 Java 侧
        // 把它当普通 zip 文件从 nativeLibraryDir 读出并解压成 prefix 环境。
        // 因此 so 必须处于「已解压到 nativeLibraryDir」的状态，即
        // useLegacyPackaging=true + android:extractNativeLibs="true" 是硬性前提。
        // 改为 false 会导致 bootstrap 安装失败、Termux 无法使用。
        jniLibs.useLegacyPackaging = true

        resources.excludes += "META-INF/LICENSE.md"
        resources.excludes += "META-INF/LICENSE-notice.md"
        resources.excludes += "META-INF/DEPENDENCIES"
        // 许可证 / 元数据类文件，运行时不需要
        resources.excludes += "META-INF/AL2.0"
        resources.excludes += "META-INF/LGPL2.1"
        resources.excludes += "META-INF/*.version"
        resources.excludes += "META-INF/*.kotlin_module"
        // Kotlin 协程调试探针，release 运行时用不到
        resources.excludes += "DebugProbesKt.bin"
        // 部分库自带的示例/文档
        resources.excludes += "META-INF/native-image/**"
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    implementation "top.yukonga.miuix.kmp:miuix-ui-android:0.9.4"
    // 玻璃导航栏（GlassNavigationBar，vendor 于 miuix PR #423 的 miuix-glass 模块）依赖 miuix-blur
    implementation "top.yukonga.miuix.kmp:miuix-blur-android:0.9.4"
    implementation "top.yukonga.miuix.kmp:miuix-icons-android:0.9.4"
        implementation "top.yukonga.miuix.kmp:miuix-preference-android:0.9.4"


    implementation "androidx.navigationevent:navigationevent-compose-android:1.0.0-alpha05"

    implementation "androidx.compose.ui:ui:1.8.3"
    implementation "androidx.compose.material3:material3:1.3.0"
    implementation "androidx.compose.material:material-icons-extended:1.7.8"
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.5"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.5"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.5"
    implementation "androidx.appcompat:appcompat:1.8.0"
    implementation "androidx.core:core-ktx:1.19.0"
    implementation "androidx.preference:preference-ktx:1.2.1"

    implementation "io.coil-kt:coil-compose:2.7.0"
implementation "io.coil-kt:coil:2.7.0"

    // Liquid Glass effects (Android-only artifacts)
    // CM Compose artifacts are excluded to avoid duplication;
    // the project's androidx.compose (already resolved to 1.11.2 via MIUIX strictly) is used instead
    implementation("io.github.kyant0:backdrop-android:2.0.1") {
        exclude group: 'org.jetbrains.compose'
        exclude group: 'org.jetbrains.compose.ui'
        exclude group: 'org.jetbrains.compose.foundation'
    }
    implementation("io.github.kyant0:shapes-android:1.2.1") {
        exclude group: 'org.jetbrains.compose'
        exclude group: 'org.jetbrains.compose.ui'
        exclude group: 'org.jetbrains.compose.foundation'
    }

    implementation project(':terminal-view')
    implementation project(':libterminal')

    implementation project(':termux-shared')
    // Integrated Termux add-on tools
    implementation project(':termux-api')
    implementation project(':termux-styling')
    implementation project(':termux-tasker')
    implementation project(':termux-widget')

    implementation("com.google.guava:guava:24.1-jre") {
        exclude group: 'com.google.guava', module: 'listenablefuture'
    }
    implementation "com.google.code.gson:gson:2.10.1"

    // AVNC dependencies
    implementation "androidx.activity:activity-ktx:1.10.1"
    implementation "androidx.fragment:fragment-ktx:1.8.9"
    implementation "androidx.dynamicanimation:dynamicanimation-ktx:1.1.0"
    implementation "androidx.biometric:biometric-ktx:1.2.0-alpha05"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.8.5"
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation "androidx.constraintlayout:constraintlayout:2.2.2"
    implementation "androidx.drawerlayout:drawerlayout:1.2.0"

    def roomVersion = "2.8.5"
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    ksp "androidx.room:room-compiler:$roomVersion"

    implementation "com.google.android.material:material:1.14.0"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0"
    implementation "org.connectbot:sshlib:2.2.48"

    implementation "com.squareup.okhttp3:okhttp:5.5.0"

    // 加密存储 GitHub 登录凭据（AES256-SIV / GCM，主密钥存于 Android Keystore）
    // 排除 tink-android，避免与 sshlib 引入的 JVM tink:1.20.0 产生重复类冲突；
    // tink 1.20.0 是 tink-android 1.8.0 的超集，security-crypto 在其上可正常运行。
    implementation("androidx.security:security-crypto:1.1.0") {
        exclude group: "com.google.crypto.tink", module: "tink-android"
    }

    // Baseline Profile 运行时安装器：在应用启动时确保 baseline.prof 文件被安装到设备
    implementation "androidx.profileinstaller:profileinstaller:1.4.1"

    // Unit tests
    testImplementation 'junit:junit:4.13.2'
    testImplementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0"
    // app/src/test 下的 FileReceiverActivityTest / TermuxFileReceiverActivityTest 依赖
    // org.robolectric，但此前未声明该依赖，导致 compileDebugUnitTestJavaWithJavac 失败，
    // 整个单元测试源集（含新增的 QuickCommandTest）根本无法编译运行。
    // 注意: 必须使用支持当前 JDK 字节码版本的 Robolectric。4.13 在 JDK 25
    // 上会抛 "Unsupported class file major version 69"（字节码插桩不支持），
    // 4.16+ 才支持较新的 class 文件版本。
    testImplementation "org.robolectric:robolectric:4.17"
    testImplementation "androidx.test:core:1.6.1"
}

afterEvaluate {
    tasks.withType(com.android.build.gradle.tasks.PackageApplication) { task ->
        task.outputs.upToDateWhen { false }
    }
}
