<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Termux Ultra · 团队 OKR 雷达图</title>
<style>
  :root{
    --bg:#f3f5fb;
    --bg-glow:radial-gradient(1200px 600px at 50% -10%, #e7ebff 0%, rgba(231,235,255,0) 60%);
    --card:#ffffff;
    --card-2:#fafbff;
    --border:#e4e8f2;
    --border-2:#eef1f8;
    --text:#151a29;
    --text-2:#3c4358;
    --dim:#78809a;
    --dim-2:#9aa1b8;
    --accent:#5566ff;
    --accent-soft:#eef0ff;
    --ok:#0ea371;
    --ok-soft:#e6f7f0;
    --near:#e08a00;
    --near-soft:#fdf3e0;
    --bad:#e5484d;
    --bad-soft:#fdeced;
    --shadow:0 1px 2px rgba(21,26,41,.04), 0 8px 24px -12px rgba(21,26,41,.14);
    --tab-dot-p:#5566ff;
    --tab-dot-t:#0aa6b8;
    --tab-dot-d:#d6539b;
  }
  html[data-theme="dark"]{
    --bg:#0c0f17;
    --bg-glow:radial-gradient(1200px 600px at 50% -10%, #1a2040 0%, rgba(26,32,64,0) 60%);
    --card:#141926;
    --card-2:#171d2c;
    --border:#242b3d;
    --border-2:#1e2534;
    --text:#e9ecf5;
    --text-2:#c3c9db;
    --dim:#8b93ab;
    --dim-2:#6d7590;
    --accent:#7d8cff;
    --accent-soft:#1d2440;
    --ok:#3dd68c;
    --ok-soft:#12291f;
    --near:#f0b849;
    --near-soft:#2c2415;
    --bad:#ef6868;
    --bad-soft:#2e1a1c;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -16px rgba(0,0,0,.7);
    --tab-dot-p:#7d8cff;
    --tab-dot-t:#2fc4d6;
    --tab-dot-d:#ef7ab8;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
    background:var(--bg);
    background-image:var(--bg-glow);
    background-repeat:no-repeat;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    transition:background-color .25s ease,color .25s ease;
  }
  .wrap{max-width:1240px;margin:0 auto;padding:30px 28px 48px;}

  /* ---------- header ---------- */
  .backlink{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--dim);
        text-decoration:none;padding:6px 12px;border-radius:99px;border:1px solid var(--border);background:var(--card);
        box-shadow:var(--shadow);margin-bottom:18px;transition:.2s;}
  .backlink:hover{color:var(--accent);border-color:var(--accent);transform:translateX(-2px);}
  .head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;}
  .head h1{font-size:25px;font-weight:750;letter-spacing:-.6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .head h1 em{font-style:normal;color:var(--accent);}
  .pill{font-size:11.5px;font-weight:600;color:var(--dim);border:1px solid var(--border);background:var(--card);
        padding:4px 10px;border-radius:99px;letter-spacing:.2px;}
  .head .sub{color:var(--dim);font-size:13.5px;margin-top:7px;line-height:1.6;}
  .head .sub code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;
        background:var(--accent-soft);color:var(--accent);padding:2px 6px;border-radius:5px;}
  .theme-btn{flex-shrink:0;width:38px;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--card);
        color:var(--dim);cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow);transition:.2s;}
  .theme-btn:hover{color:var(--accent);border-color:var(--accent);}
  .theme-btn svg{width:17px;height:17px;}
  html[data-theme="light"] .icon-moon{display:block;} html[data-theme="light"] .icon-sun{display:none;}
  html[data-theme="dark"] .icon-moon{display:none;}   html[data-theme="dark"] .icon-sun{display:block;}

  /* ---------- tabs ---------- */
  .tabs{display:flex;gap:9px;margin-top:22px;flex-wrap:wrap;}
  .tab{display:inline-flex;align-items:center;gap:8px;padding:9px 17px;border-radius:10px;border:1px solid var(--border);
       background:var(--card);color:var(--dim);font-size:13.5px;font-weight:600;cursor:pointer;
       font-family:inherit;box-shadow:var(--shadow);transition:transform .16s,color .2s,border-color .2s,background-color .2s;}
  .tab:hover{color:var(--text);border-color:var(--accent);transform:translateY(-1px);}
  .tab .d{width:8px;height:8px;border-radius:50%;background:var(--dim-2);transition:.2s;}
  .tab[data-t="product"] .d{background:var(--tab-dot-p);}
  .tab[data-t="tech"] .d{background:var(--tab-dot-t);}
  .tab[data-t="design"] .d{background:var(--tab-dot-d);}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .tab.on .d{background:#fff;}
  .tab .meta{font-size:11px;font-weight:600;opacity:.7;font-variant-numeric:tabular-nums;}

  /* ---------- layout ---------- */
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 332px;gap:20px;margin-top:18px;align-items:start;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);}
  .chart-card{padding:18px 20px 16px;display:flex;flex-direction:column;}
  .side{display:flex;flex-direction:column;gap:14px;}
  .sc{padding:16px 17px;}

  /* ---------- chart header ---------- */
  .chead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
         padding-bottom:12px;border-bottom:1px solid var(--border-2);}
  .chead .t{font-size:13.5px;font-weight:700;}
  .chead .t span{color:var(--dim);font-weight:500;margin-left:6px;font-size:12.5px;}
  .chips{display:flex;gap:7px;flex-wrap:wrap;}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:7px;}
  .chip i{width:6px;height:6px;border-radius:50%;display:block;}
  .chip.ok{color:var(--ok);background:var(--ok-soft);} .chip.ok i{background:var(--ok);}
  .chip.near{color:var(--near);background:var(--near-soft);} .chip.near i{background:var(--near);}
  .chip.bad{color:var(--bad);background:var(--bad-soft);} .chip.bad i{background:var(--bad);}

  /* ---------- radar ---------- */
  .radar-box{display:flex;align-items:center;justify-content:center;padding:8px 0 2px;flex:1;}
  #radar{width:100%;max-width:540px;height:auto;overflow:visible;}
  .legends{display:flex;flex-wrap:wrap;gap:8px 22px;justify-content:center;padding-top:10px;margin-top:6px;
           border-top:1px solid var(--border-2);}
  .lg{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--dim);}
  .lg .ln{width:26px;height:0;border-top:2px dashed var(--accent);opacity:.75;}
  .lg .fill{width:22px;height:13px;border-radius:3px;background:color-mix(in srgb,var(--accent) 20%,transparent);
            border:1.6px solid var(--accent);}
  .lg .st{width:10px;height:10px;border-radius:50%;}
  .sep{width:1px;height:14px;background:var(--border);}

  /* ---------- sidebar ---------- */
  .label{font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.7px;}
  .rate{display:flex;align-items:baseline;gap:9px;margin-top:9px;flex-wrap:wrap;}
  .rate .n{font-size:34px;font-weight:780;letter-spacing:-1.4px;font-variant-numeric:tabular-nums;line-height:1;}
  .rate .u{font-size:16px;font-weight:700;opacity:.65;}
  .badge{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:99px;
         font-variant-numeric:tabular-nums;}
  .badge.up{color:var(--ok);background:var(--ok-soft);} .badge.down{color:var(--bad);background:var(--bad-soft);}
  .track{height:7px;border-radius:99px;background:var(--border-2);overflow:hidden;margin-top:12px;}
  .track i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .5s cubic-bezier(.22,1,.36,1);}
  .subline{font-size:12.5px;color:var(--dim);margin-top:9px;font-variant-numeric:tabular-nums;}

  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;}
  .row + .row{border-top:1px solid var(--border-2);}
  .row .nm{font-size:13.5px;display:flex;align-items:center;gap:8px;min-width:0;}
  .row .nm b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .row .sc2{font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .row .sc2 b{color:var(--text);font-weight:700;}
  .tag{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:5px;margin-left:6px;white-space:nowrap;}
  .tag.ok{color:var(--ok);background:var(--ok-soft);} .tag.near{color:var(--near);background:var(--near-soft);}
  .tag.bad{color:var(--bad);background:var(--bad-soft);}
  .mini{height:5px;border-radius:99px;background:var(--border-2);overflow:hidden;margin:2px 0 9px;}
  .mini i{display:block;height:100%;border-radius:99px;}
  .delta{font-size:12.5px;font-weight:750;font-variant-numeric:tabular-nums;}
  .delta.up{color:var(--ok);} .delta.down{color:var(--bad);}
  .delta.flat{color:var(--dim);}
  .prev{font-size:11.5px;color:var(--dim-2);font-variant-numeric:tabular-nums;margin-right:6px;}

  .sect{font-size:12px;font-weight:700;color:var(--dim);margin-bottom:4px;display:flex;align-items:center;
        justify-content:space-between;}
  .sect span{font-weight:600;font-size:11px;color:var(--dim-2);}
  .anim{animation:fadeUp .38s cubic-bezier(.22,1,.36,1) both;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(7px);}to{opacity:1;transform:none;}}

  .foot{margin-top:20px;font-size:11.5px;color:var(--dim-2);line-height:1.85;text-align:center;}
  .foot b{color:var(--dim);font-weight:600;}

  /* ---------- responsive ---------- */
  @media (max-width:1000px){
    .layout{grid-template-columns:minmax(0,1fr);}
    .side{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    .side > .sc:first-child{grid-column:1 / -1;}
    .side > .sc:last-child{grid-column:1 / -1;}
  }
  @media (max-width:760px){
    #radar{max-width:100%;}
    .side{grid-template-columns:1fr;}
    .side > .sc{grid-column:auto !important;}
  }
  @media (max-width:560px){
    .wrap{padding:20px 15px 34px;}
    .head h1{font-size:21px;}
    .rate .n{font-size:30px;}
    .tabs{gap:7px;}
    .tab{padding:8px 13px;font-size:12.5px;}
    .chart-card{padding:14px 13px 12px;}
    .legends{gap:7px 14px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <a class="backlink" href="../">← 返回文档首页</a>

  <div class="head">
    <div>
      <h1>团队 <em>OKR</em> 雷达图 <span class="pill">Q3 2026</span></h1>
      <p class="sub">
        数据基线：<code>TiG-Kira/Termux-Ultra</code> · 开源仓库 8 大能力域 ｜ 目标 vs 实际 达成度对比
      </p>
    </div>
    <button class="theme-btn" id="themeBtn" aria-label="切换主题" title="切换明暗主题">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>

  <div class="tabs" id="tabs" role="tablist"></div>

  <div class="layout">
    <section class="card chart-card">
      <div class="chead">
        <div class="t">能力域达成矩阵 <span id="teamHint"></span></div>
        <div class="chips" id="chips"></div>
      </div>
      <div class="radar-box">
        <svg id="radar" viewBox="0 0 520 460" role="img" aria-label="团队 OKR 雷达图"></svg>
      </div>
      <div class="legends">
        <div class="lg"><span class="ln"></span>目标值</div>
        <div class="lg"><span class="fill"></span>实际值</div>
        <div class="sep"></div>
        <div class="lg"><span class="st" style="background:var(--ok)"></span>超额 ≥100%</div>
        <div class="lg"><span class="st" style="background:var(--near)"></span>接近 93–99%</div>
        <div class="lg"><span class="st" style="background:var(--bad)"></span>不足 &lt;93%</div>
      </div>
    </section>

    <aside class="side" id="side"></aside>
  </div>

  <p class="foot">
    <b>评分口径</b>：各维度满分 100，权重等权；整体完成率 = Σ实际 / Σ目标。<br>
    本页为单文件离线可视化，无任何外部依赖 · 数据基于 Termux Ultra 开源仓库能力域建模。
  </p>
</div>

<script>
/* =========================================================
   维度：按 Termux Ultra 开源仓库的真实能力域划分（8 轴）
   ========================================================= */
const DIMS = ['终端内核','插件生态','AI 助手','远程容器','界面动效','工程基建','文档本地化','社区开源'];

const TEAMS = {
  product: {
    name:'产品团队', color:'#5566ff',
    note:'以交付节奏与用户可感价值为主轴',
    dims:[
      {target:90, actual:86, prev:82}, // 终端内核
      {target:85, actual:78, prev:71}, // 插件生态
      {target:90, actual:88, prev:80}, // AI 助手
      {target:80, actual:72, prev:69}, // 远程容器
      {target:85, actual:81, prev:78}, // 界面动效
      {target:75, actual:66, prev:62}, // 工程基建
      {target:90, actual:84, prev:80}, // 文档本地化
      {target:85, actual:74, prev:68}  // 社区开源
    ]
  },
  tech: {
    name:'技术团队', color:'#0aa6b8',
    note:'聚焦内核性能、插件协议与工程稳定性',
    dims:[
      {target:95, actual:97, prev:91},
      {target:90, actual:93, prev:85},
      {target:85, actual:78, prev:74},
      {target:85, actual:88, prev:82},
      {target:75, actual:79, prev:72},
      {target:90, actual:92, prev:84},
      {target:80, actual:68, prev:67},
      {target:70, actual:62, prev:60}
    ]
  },
  design: {
    name:'设计团队', color:'#d6539b',
    note:'主导 Miuix 视觉体系与交互一致性',
    dims:[
      {target:75, actual:72, prev:68},
      {target:70, actual:64, prev:58},
      {target:85, actual:83, prev:76},
      {target:65, actual:60, prev:55},
      {target:95, actual:96, prev:87},
      {target:70, actual:62, prev:58},
      {target:90, actual:87, prev:80},
      {target:75, actual:71, prev:65}
    ]
  }
};

/* 达成状态阈值 */
const T_OK = 1.00, T_NEAR = 0.93;
function statusOf(target, actual){
  const r = actual / target;
  if (r >= T_OK) return 'ok';
  if (r >= T_NEAR) return 'near';
  return 'bad';
}
const STATUS_TEXT = { ok:'超额', near:'接近', bad:'不足' };

/* 主题色板（SVG 用 JS 色值，避免 var() 兼容问题） */
const PAL = {
  light:{
    grid:'#e9ecf5', gridOuter:'#d8dced', axis:'#e4e7f1', ring:'#aeb4c9',
    tStroke:'#8b95ff', tFill:'rgba(139,149,255,.07)',
    aStroke:'#5566ff', aFill:'rgba(85,102,255,.20)',
    label:'#151a29', dim:'#8b93a8', dotRing:'#ffffff',
    ok:'#0ea371', near:'#e08a00', bad:'#e5484d'
  },
  dark:{
    grid:'#242b3d', gridOuter:'#313a51', axis:'#242b3d', ring:'#5d6683',
    tStroke:'#8b95ff', tFill:'rgba(139,149,255,.07)',
    aStroke:'#8b95ff', aFill:'rgba(125,140,255,.24)',
    label:'#e9ecf5', dim:'#79819b', dotRing:'#141926',
    ok:'#3dd68c', near:'#f0b849', bad:'#ef6868'
  }
};
let theme = document.documentElement.dataset.theme || 'light';
function pal(){ return PAL[theme]; }
function stColor(s){ const p=pal(); return s==='ok'?p.ok : s==='near'?p.near : p.bad; }

/* ---------------- 雷达图绘制 ---------------- */
const CX = 254, CY = 230, MAXR = 148, N = DIMS.length, STEP = 360 / N;
function polar(r, deg){
  const rad = (deg - 90) * Math.PI / 180;
  return { x: CX + r * Math.cos(rad), y: CY + r * Math.sin(rad) };
}
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function drawRadar(vals){
  const p = pal(), svg = document.getElementById('radar');
  const RATIOS = [.2,.4,.6,.8,1];
  let h = '';

  /* 同心网格 */
  RATIOS.forEach(l => {
    const r = MAXR * l, pts = [];
    for (let i=0;i<N;i++){ const q = polar(r, i*STEP); pts.push(q.x.toFixed(1)+','+q.y.toFixed(1)); }
    const isOuter = l === 1;
    h += '<polygon points="'+pts.join(' ')+'" fill="'+(isOuter?'none':'none')+'" stroke="'
       + (isOuter ? p.gridOuter : p.grid) + '" stroke-width="'+(isOuter?1.4:1)+'"/>';
    const lp = polar(r, 0);
    h += '<text x="'+(lp.x+5)+'" y="'+lp.y.toFixed(1)+'" fill="'+p.ring+'" font-size="9.5" '
       + 'dominant-baseline="middle" font-variant-numeric="tabular-nums">'+(l*100)+'</text>';
  });

  /* 轴线 */
  for (let i=0;i<N;i++){
    const q = polar(MAXR, i*STEP);
    h += '<line x1="'+CX+'" y1="'+CY+'" x2="'+q.x.toFixed(1)+'" y2="'+q.y.toFixed(1)+
         '" stroke="'+p.axis+'" stroke-width="1"/>';
  }

  /* 目标 / 实际 多边形 */
  const tPts = [], aPts = [];
  vals.forEach((v,i) => {
    const tq = polar((v.target/100)*MAXR, i*STEP);
    const aq = polar((v.actual/100)*MAXR, i*STEP);
    tPts.push(tq.x.toFixed(1)+','+tq.y.toFixed(1));
    aPts.push(aq.x.toFixed(1)+','+aq.y.toFixed(1));
  });
  h += '<polygon points="'+tPts.join(' ')+'" fill="'+p.tFill+'" stroke="'+p.tStroke+
       '" stroke-width="2" stroke-dasharray="7 4" stroke-linejoin="round" opacity=".95"/>';
  h += '<polygon points="'+aPts.join(' ')+'" fill="'+p.aFill+'" stroke="'+p.aStroke+
       '" stroke-width="2.4" stroke-linejoin="round"/>';

  /* 顶点 + 轴标签 */
  vals.forEach((v,i) => {
    const ang = i*STEP, aq = polar((v.actual/100)*MAXR, ang);
    const st = statusOf(v.target, v.actual), col = stColor(st);
    const pct = Math.round(v.actual / v.target * 100);
    h += '<circle cx="'+aq.x.toFixed(1)+'" cy="'+aq.y.toFixed(1)+'" r="5.2" fill="'+col+'" stroke="'+p.dotRing+'" stroke-width="2.2">'
       + '<title>'+esc(DIMS[i])+'：'+Math.round(v.actual)+' / '+v.target+'（'+pct+'% · '+STATUS_TEXT[st]+'）</title></circle>';

    const lq = polar(MAXR + 30, ang);
    const cos = Math.cos((ang-90)*Math.PI/180), sin = Math.sin((ang-90)*Math.PI/180);
    const anc = cos > 0.15 ? 'start' : (cos < -0.15 ? 'end' : 'middle');
    const yTop = lq.y - 8, yBot = lq.y + 9;
    h += '<text x="'+lq.x.toFixed(1)+'" y="'+yTop.toFixed(1)+'" text-anchor="'+anc+'" dominant-baseline="middle" '
       + 'fill="'+p.label+'" font-size="12.5" font-weight="650">'+esc(DIMS[i])+'</text>';
    h += '<text x="'+lq.x.toFixed(1)+'" y="'+yBot.toFixed(1)+'" text-anchor="'+anc+'" dominant-baseline="middle" '
       + 'font-size="12" font-variant-numeric="tabular-nums">'
       + '<tspan fill="'+col+'" font-weight="700">'+Math.round(v.actual)+'</tspan>'
       + '<tspan fill="'+p.dim+'"> / '+v.target+'</tspan></text>';
  });

  svg.innerHTML = h;
}

/* ---------------- 顶部状态统计 ---------------- */
function counts(team){
  const c = { ok:0, near:0, bad:0 };
  team.dims.forEach((v,i) => c[statusOf(v.target, v.actual)]++);
  return c;
}
function buildChips(k){
  const c = counts(TEAMS[k]);
  document.getElementById('chips').innerHTML =
      '<span class="chip ok"><i></i>超额 '+c.ok+'</span>'
    + '<span class="chip near"><i></i>接近 '+c.near+'</span>'
    + '<span class="chip bad"><i></i>不足 '+c.bad+'</span>';
  document.getElementById('teamHint').textContent = '· ' + TEAMS[k].note;
}

/* ---------------- 侧栏 ---------------- */
let countRAF = null;
function countUp(el, to, dur){
  cancelAnimationFrame(countRAF);
  const t0 = performance.now();
  const step = now => {
    const pr = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - pr, 3);
    el.textContent = (to * e).toFixed(1);
    if (pr < 1) countRAF = requestAnimationFrame(step);
    else el.textContent = to.toFixed(1);
  };
  countRAF = requestAnimationFrame(step);
}

function buildSide(k){
  const team = TEAMS[k], d = team.dims;
  const tT = d.reduce((s,v)=>s+v.target, 0);
  const tA = d.reduce((s,v)=>s+v.actual, 0);
  const pT = d.reduce((s,v)=>s+v.prev, 0);
  const rate = tA / tT * 100;
  const prevRate = pT / tT * 100;
  const diffPt = rate - prevRate;
  const rStatus = rate >= 95 ? 'ok' : rate >= 90 ? 'near' : 'bad';
  const rColor = stColor(rStatus);

  const ranked = d.map((v,i)=>({ i, r: v.actual / v.target })).sort((a,b)=>b.r-a.r);
  const best = ranked[0], worst = ranked[ranked.length-1];

  let h = '';

  /* 1. 整体完成率 */
  h += '<div class="card sc anim">'
     +   '<div class="label">整体完成率</div>'
     +   '<div class="rate">'
     +     '<span class="n" id="rateNum" style="color:'+rColor+'">0.0</span>'
     +     '<span class="u" style="color:'+rColor+'">%</span>'
     +     '<span class="badge '+(diffPt>=0?'up':'down')+'">'+(diffPt>=0?'▲':'▼')+' '
     +       Math.abs(diffPt).toFixed(1)+' pt 环比</span>'
     +   '</div>'
     +   '<div class="track"><i style="width:'+Math.min(100,rate).toFixed(1)+'%;background:'+rColor+'"></i></div>'
     +   '<div class="subline">'+tA+' / '+tT+' 总分 ｜ 上季 '+prevRate.toFixed(1)+'%</div>'
     + '</div>';

  /* 2. 最强 / 最弱 */
  const bi = best.i, wi = worst.i;
  const bp = Math.round(d[bi].actual / d[bi].target * 100);
  const wp = Math.round(d[wi].actual / d[wi].target * 100);
  h += '<div class="card sc anim" style="animation-delay:.04s">'
     +   '<div class="label">最强 / 最弱维度</div>'
     +   '<div class="row"><div class="nm"><span class="dot" style="background:'+stColor(statusOf(d[bi].target,d[bi].actual))+'"></span>'
     +     '<b>'+DIMS[bi]+'</b><span class="tag '+statusOf(d[bi].target,d[bi].actual)+'">'+STATUS_TEXT[statusOf(d[bi].target,d[bi].actual)]+'</span></div>'
     +     '<div class="sc2"><b>'+d[bi].actual+'</b> / '+d[bi].target+' <span style="color:'+stColor(statusOf(d[bi].target,d[bi].actual))+'">'+bp+'%</span></div></div>'
     +   '<div class="row"><div class="nm"><span class="dot" style="background:'+stColor(statusOf(d[wi].target,d[wi].actual))+'"></span>'
     +     '<b>'+DIMS[wi]+'</b><span class="tag '+statusOf(d[wi].target,d[wi].actual)+'">'+STATUS_TEXT[statusOf(d[wi].target,d[wi].actual)]+'</span></div>'
     +     '<div class="sc2"><b>'+d[wi].actual+'</b> / '+d[wi].target+' <span style="color:'+stColor(statusOf(d[wi].target,d[wi].actual))+'">'+wp+'%</span></div></div>'
     + '</div>';

  /* 3. 各维度详情 */
  h += '<div class="card sc anim" style="animation-delay:.08s">'
     +   '<div class="sect">各维度详情 <span>实际 / 目标</span></div>';
  d.forEach((v,i) => {
    const st = statusOf(v.target, v.actual), col = stColor(st);
    const pct = Math.round(v.actual / v.target * 100);
    h += '<div class="row"><div class="nm"><span class="dot" style="background:'+col+'"></span><b>'+DIMS[i]+'</b></div>'
       +   '<div class="sc2"><b>'+v.actual+'</b> / '+v.target+' <span style="color:'+col+';font-weight:700">'+pct+'%</span></div></div>'
       + '<div class="mini"><i style="width:'+Math.min(100,pct)+'%;background:'+col+'"></i></div>';
  });
  h += '</div>';

  /* 4. 环比趋势 */
  h += '<div class="card sc anim" style="animation-delay:.12s">'
     +   '<div class="sect">环比趋势 <span>vs 上季度</span></div>';
  d.forEach((v,i) => {
    const dv = v.actual - v.prev;
    const cls = dv > 0 ? 'up' : dv < 0 ? 'down' : 'flat';
    const sign = dv > 0 ? '+' : '';
    h += '<div class="row"><div class="nm"><b>'+DIMS[i]+'</b></div>'
       +   '<div style="display:flex;align-items:baseline">'
       +     '<span class="prev">'+v.prev+' → '+v.actual+'</span>'
       +     '<span class="delta '+cls+'">'+sign+dv+'</span>'
       +   '</div></div>';
  });
  h += '</div>';

  document.getElementById('side').innerHTML = h;
  const rn = document.getElementById('rateNum');
  if (rn) countUp(rn, rate, 800);
}

/* ---------------- 团队切换 ---------------- */
function buildTabs(){
  const el = document.getElementById('tabs');
  el.innerHTML = Object.entries(TEAMS).map(([k,t]) => {
    const tot = t.dims.reduce((s,v)=>s+v.actual,0);
    const tar = t.dims.reduce((s,v)=>s+v.target,0);
    const pct = Math.round(tot / tar * 100);
    return '<button class="tab'+(k===active?' on':'')+'" data-t="'+k+'" role="tab" aria-selected="'+(k===active)+'">'
      + '<span class="d"></span>'+t.name+'<span class="meta">'+pct+'%</span></button>';
  }).join('');
  el.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.t === active) return;
    active = b.dataset.t;
    refresh();
  }));
}

/* 缓动过渡：切换团队时多边形平滑变形 */
let cur = [], raf = null;
function tweenTo(k){
  const to = TEAMS[k].dims.map(v => ({ target:v.target, actual:v.actual }));
  const from = cur.map(v => ({ target:v.target, actual:v.actual }));
  const t0 = performance.now(), DUR = 620;
  cancelAnimationFrame(raf);
  const step = now => {
    const p = Math.min(1, (now - t0) / DUR), e = 1 - Math.pow(1 - p, 3);
    cur = from.map((f,i) => ({
      target: f.target + (to[i].target - f.target) * e,
      actual: f.actual + (to[i].actual - f.actual) * e
    }));
    drawRadar(cur);
    if (p < 1) raf = requestAnimationFrame(step);
    else cur = to.map(v => ({ ...v }));
  };
  raf = requestAnimationFrame(step);
}

let active = 'product';
function refresh(){
  buildTabs(); buildChips(active); buildSide(active); tweenTo(active);
}

/* 主题切换 */
document.getElementById('themeBtn').addEventListener('click', () => {
  theme = theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = theme;
  drawRadar(cur);           // 用新色板重绘
});

cur = TEAMS[active].dims.map(v => ({ target:v.target, actual:v.actual }));
refresh();
</script>
