## Project-wide Gradle settings.
#
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx10248m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
org.gradle.jvmargs=-Xmx4096M \
--add-exports=java.base/sun.nio.ch=ALL-UNNAMED \
--add-opens=java.base/java.lang=ALL-UNNAMED \
--add-opens=java.base/java.lang.reflect=ALL-UNNAMED \
--add-opens=java.base/java.io=ALL-UNNAMED \
--add-exports=jdk.unsupported/sun.misc=ALL-UNNAMED \
-Dhttps.protocols=TLSv1.2,TLSv1.3 \
-Djava.net.preferIPv4Stack=true

android.useAndroidX=true
android.signing.v1.enabled=true
android.signing.v2.enabled=true

minSdkVersion=28
targetSdkVersion=28
ndkVersion=28.2.13676358
compileSdkVersion=37

markwonVersion=4.6.2

android.projectAsAbsoluteInPath=false

# 内嵌 RustDesk 所用的 Flutter 引擎版本（= Flutter SDK 的 bin/internal/engine.version）。
# 引擎与 RustDesk 的 Dart AOT 快照（libapp.so）必须严格同版本，配错不会编译报错，而是运行时
# 黑屏。CI（.github/workflows/rustdesk-aar.yml）在构建前会比对本值与 SDK 的 engine.version，
# 不一致直接失败；升级 RustDesk 时同步改这里。
rustdesk.flutterEngine=a18df97ca57a249df5d8d68cd0820600223ce262
