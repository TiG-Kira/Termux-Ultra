apply plugin: 'com.android.library'

android {
    namespace "com.termux.shared"
    compileSdkVersion project.properties.compileSdkVersion.toInteger()

    dependencies {
        implementation 'androidx.appcompat:appcompat:1.8.0'
        implementation "androidx.annotation:annotation:1.3.0"
        implementation "org.jetbrains:annotations:26.1.0"
        implementation "androidx.core:core:1.6.0"
        implementation 'com.google.android.material:material:1.14.0'
        implementation("com.google.guava:guava:24.1-jre") {
            exclude group: 'com.google.guava', module: 'listenablefuture'
        }
        implementation "io.noties.markwon:core:$markwonVersion"
        implementation "io.noties.markwon:ext-strikethrough:$markwonVersion"
        implementation "io.noties.markwon:linkify:$markwonVersion"
        implementation "io.noties.markwon:recycler:$markwonVersion"
        implementation "org.lsposed.hiddenapibypass:hiddenapibypass:6.1"

        // Do not increment version higher than 2.5 or there
        // will be runtime exceptions on android < 8
        // due to missing classes like java.nio.file.Path.
        implementation "commons-io:commons-io:2.5"

        implementation "com.termux:termux-am-library:v2.0.0"
    }

    defaultConfig {
        minSdkVersion project.properties.minSdkVersion.toInteger()
        targetSdkVersion project.properties.targetSdkVersion.toInteger()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        // 同 app 模块：只关掉确认无意义的规则，保留 abortOnError 默认（true）作为质量门禁。
        // MissingTranslation：本库无独立多语种资源，缺翻译是预期状态。
        // MissingSuperCall：ReportActivity / TextIOActivity 的 onBackPressed() 刻意不调 super，
        //   已在两处覆写点用 @SuppressLint 标注。
        disable 'MissingTranslation'
        disable 'MissingSuperCall'
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}


