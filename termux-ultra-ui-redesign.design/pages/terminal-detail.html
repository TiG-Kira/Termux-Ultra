<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>终端 1 - Termux Ultra</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    .terminal-screen {
      font-family: var(--tu-font-mono);
      background-color: #0a0a0a;
      color: #4ade80;
    }
    .terminal-screen .prompt { color: #34d399; }
    .terminal-screen .cmd { color: #a7f3d0; }
    .cursor {
      display: inline-block;
      width: 8px;
      height: 1.2em;
      background-color: #4ade80;
      vertical-align: text-bottom;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .keyboard-layout.hidden { display: none; }
    .key-btn-primary {
      background-color: var(--tu-primary) !important;
      color: #ffffff !important;
    }
  </style>
</head>
<body class="tu-bg tu-text h-screen flex flex-col overflow-hidden">
  <header class="tu-top-appbar">
    <div class="flex items-center">
      <button class="tu-top-appbar-btn" data-dom-id="back-terminal" aria-label="返回">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      </button>
    </div>
    <h1 class="tu-top-appbar-title">终端 1</h1>
    <div class="flex items-center gap-1 pr-1">
      <button class="tu-top-appbar-btn" data-dom-id="session-menu" aria-label="菜单"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg></button>
      <button class="tu-top-appbar-btn" data-dom-id="session-keyboard" aria-label="键盘"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect><path d="M6 8h.001M10 8h.001M14 8h.001M18 8h.001M8 12h.001M12 12h.001M16 12h.001M7 16h10"></path></svg></button>
    </div>
  </header>

  <main class="flex-1 flex flex-col min-h-0 relative">
    <!-- 终端模拟区 -->
    <section class="terminal-screen flex-1 p-4 overflow-auto text-sm leading-relaxed">
      <button id="themeToggle" class="absolute top-3 right-3 p-2 rounded-full bg-white/10 text-green-400 hover:bg-white/20 active:scale-95 transition" aria-label="切换主题">
        <svg id="moonIcon" class="block" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        <svg id="sunIcon" class="hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      </button>
      <div class="mb-1"><span class="prompt">~ $</span> <span class="cmd">pkg update</span></div>
      <div class="opacity-90 mb-1">正在更新软件包列表...</div>
      <div class="opacity-90 mb-1">完成。</div>
      <div class="mb-1"><span class="prompt">~ $</span> <span class="cmd">uname -a</span></div>
      <div class="opacity-90 mb-1">Linux localhost 5.15-android13-8-00001-g3b2f79a...</div>
      <div><span class="prompt">~ $</span> <span class="cmd">ls -la</span><span class="cursor"></span></div>
    </section>

    <!-- 键盘区域 -->
    <div id="keyboardWrapper" class="tu-surface border-t tu-border">
      <!-- 配置选择器 -->
      <div class="px-3 pt-2 pb-1">
        <div class="miuix-tabrow" role="tablist" aria-label="键盘配置">
          <button class="miuix-tab active" data-profile="default" data-dom-id="profile-default" role="tab" aria-selected="true">默认</button>
          <button class="miuix-tab" data-profile="hacker" data-dom-id="profile-hacker" role="tab" aria-selected="false">Hacker</button>
          <button class="miuix-tab" data-profile="vim" data-dom-id="profile-vim" role="tab" aria-selected="false">Vim</button>
        </div>
      </div>

      <!-- 键盘按键 -->
      <div class="p-2 pb-4">
        <!-- 默认配置 -->
        <div data-keyboard="default" class="keyboard-layout">
          <div class="flex gap-1.5 mb-1.5">
            <button class="key-btn flex-1">ESC</button>
            <button class="key-btn flex-1">TAB</button>
            <button class="key-btn flex-1">/</button>
            <button class="key-btn flex-1">-</button>
            <button class="key-btn flex-1">HOME</button>
            <button class="key-btn flex-1">END</button>
            <button class="key-btn flex-1">PGUP</button>
            <button class="key-btn flex-1">PGDN</button>
          </div>
          <div class="flex gap-1.5 mb-1.5">
            <button class="key-btn flex-1">Ctrl</button>
            <button class="key-btn flex-1">Alt</button>
            <button class="key-btn flex-1">↑</button>
            <button class="key-btn flex-1">↓</button>
            <button class="key-btn flex-1">←</button>
            <button class="key-btn flex-1">→</button>
            <button class="key-btn flex-1">复制</button>
            <button class="key-btn flex-1">粘贴</button>
          </div>
          <div class="flex gap-1.5">
            <button class="key-btn flex-[2]">输入法</button>
            <button class="key-btn flex-[2]" data-action="hide-keyboard">隐藏</button>
            <button class="key-btn flex-[3]">空格</button>
            <button class="key-btn key-btn-primary flex-[2]">回车</button>
          </div>
        </div>

        <!-- Hacker 配置 -->
        <div data-keyboard="hacker" class="keyboard-layout hidden">
          <div class="flex gap-1.5 mb-1.5">
            <button class="key-btn flex-1">ESC</button>
            <button class="key-btn flex-1">TAB</button>
            <button class="key-btn flex-1">/</button>
            <button class="key-btn flex-1">~</button>
            <button class="key-btn flex-1">|</button>
            <button class="key-btn flex-1">&amp;</button>
            <button class="key-btn flex-1">;</button>
            <button class="key-btn flex-1">$</button>
          </div>
          <div class="flex gap-1.5 mb-1.5">
            <button class="key-btn flex-1">HOME</button>
            <button class="key-btn flex-1">END</button>
            <button class="key-btn flex-1">PGUP</button>
            <button class="key-btn flex-1">PGDN</button>
            <button class="key-btn flex-1">↑</button>
            <button class="key-btn flex-1">↓</button>
            <button class="key-btn flex-1">←</button>
            <button class="key-btn flex-1">→</button>
          </div>
          <div class="flex gap-1.5">
            <button class="key-btn flex-1">Ctrl</button>
            <button class="key-btn flex-1">Alt</button>
            <button class="key-btn flex-1">python</button>
            <button class="key-btn flex-1">vim</button>
            <button class="key-btn flex-1">nano</button>
            <button class="key-btn flex-1">apt</button>
            <button class="key-btn key-btn-primary flex-[2]" data-action="hide-keyboard">回车</button>
          </div>
        </div>

        <!-- Vim 配置 -->
        <div data-keyboard="vim" class="keyboard-layout hidden">
          <div class="flex gap-1.5 mb-1.5">
            <button class="key-btn flex-1">ESC</button>
            <button class="key-btn flex-1">:</button>
            <button class="key-btn flex-1">w</button>
            <button class="key-btn flex-1">q</button>
            <button class="key-btn flex-1">!</button>
            <button class="key-btn flex-1">u</button>
            <button class="key-btn flex-1">r</button>
            <button class="key-btn flex-1">.</button>
          </div>
          <div class="flex gap-1.5 mb-1.5">
            <button class="key-btn flex-1">h</button>
            <button class="key-btn flex-1">j</button>
            <button class="key-btn flex-1">k</button>
            <button class="key-btn flex-1">l</button>
            <button class="key-btn flex-1">0</button>
            <button class="key-btn flex-1">$</button>
            <button class="key-btn flex-1">gg</button>
            <button class="key-btn flex-1">G</button>
          </div>
          <div class="flex gap-1.5">
            <button class="key-btn flex-1">i</button>
            <button class="key-btn flex-1">a</button>
            <button class="key-btn flex-1">o</button>
            <button class="key-btn flex-1">v</button>
            <button class="key-btn flex-1">y</button>
            <button class="key-btn flex-1">p</button>
            <button class="key-btn flex-1">d</button>
            <button class="key-btn key-btn-primary flex-1" data-action="hide-keyboard">回车</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- 键盘切换浮动按钮 -->
  <button id="keyboardToggle" class="fixed bottom-4 right-4 miuix-btn miuix-btn-primary rounded-full shadow-lg w-12 h-12 p-0 z-50" aria-label="隐藏键盘">
    <svg id="kbdHideIcon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
    <svg id="kbdShowIcon" class="hidden" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect><path d="M6 8h.001M10 8h.001M14 8h.001M18 8h.001M8 12h.001M12 12h.001M16 12h.001M7 16h10"></path></svg>
  </button>

  <script>
    // 主题切换
    const themeToggle = document.getElementById('themeToggle');
    const moonIcon = document.getElementById('moonIcon');
    const sunIcon = document.getElementById('sunIcon');
    themeToggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      moonIcon.classList.toggle('hidden', !isDark);
      sunIcon.classList.toggle('hidden', isDark);
    });

    // 配置切换
    const profileTabs = document.querySelectorAll('[data-profile]');
    const keyboards = document.querySelectorAll('[data-keyboard]');
    profileTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const profile = tab.dataset.profile;
        profileTabs.forEach(t => {
          t.classList.remove('active');
          t.setAttribute('aria-selected', 'false');
        });
        tab.classList.add('active');
        tab.setAttribute('aria-selected', 'true');
        keyboards.forEach(k => {
          k.classList.toggle('hidden', k.dataset.keyboard !== profile);
        });
      });
    });

    // 键盘显隐切换
    const keyboardWrapper = document.getElementById('keyboardWrapper');
    const keyboardToggle = document.getElementById('keyboardToggle');
    const kbdHideIcon = document.getElementById('kbdHideIcon');
    const kbdShowIcon = document.getElementById('kbdShowIcon');
    function updateKeyboardToggle(isHidden) {
      kbdHideIcon.classList.toggle('hidden', isHidden);
      kbdShowIcon.classList.toggle('hidden', !isHidden);
      keyboardToggle.setAttribute('aria-label', isHidden ? '显示键盘' : '隐藏键盘');
    }
    keyboardToggle.addEventListener('click', () => {
      const isHidden = keyboardWrapper.classList.toggle('hidden');
      updateKeyboardToggle(isHidden);
    });
    document.querySelectorAll('[data-action="hide-keyboard"]').forEach(btn => {
      btn.addEventListener('click', () => {
        keyboardWrapper.classList.add('hidden');
        updateKeyboardToggle(true);
      });
    });
  </script>
</body>
</html>
