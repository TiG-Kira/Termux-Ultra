<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Termux Ultra — 终端</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      color-scheme: light dark;
    }
    body {
      font-family: var(--tu-font-family);
      -webkit-tap-highlight-color: transparent;
    }
    .status-success { background-color: var(--tu-success-container); }
    .dark .status-success { background-color: var(--tu-success-container-dark); }
    .status-warning { background-color: var(--tu-warning-container); }
    .dark .status-warning { background-color: var(--tu-warning-container-dark); }
    .status-error { background-color: var(--tu-error-container); }
    .dark .status-error { background-color: var(--tu-error-container-dark); }
    .status-dot-success { background-color: var(--tu-success); }
    .status-dot-warning { background-color: var(--tu-warning); }
    .status-dot-error { background-color: var(--tu-error); }
  </style>
  <script>
    (function () {
      const saved = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
</head>
<body class="tu-bg tu-text antialiased">
  <main class="min-h-screen" style="padding-bottom: var(--tu-page-bottom);">
    <!-- TopAppBar -->
    <header class="tu-top-appbar">
      <div class="w-10"></div>
      <h1 class="tu-top-appbar-title">终端</h1>
      <div class="flex items-center gap-1">
        <button class="tu-top-appbar-btn" data-dom-id="wake-lock" aria-label="唤醒锁">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        </button>
        <button class="tu-top-appbar-btn" data-dom-id="new-terminal" aria-label="新建终端">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
      </div>
    </header>

    <!-- 搜索框 -->
    <div class="px-4 pb-3 pt-2">
      <div class="miuix-search">
        <svg class="shrink-0 tu-text-variant" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" placeholder="输入相关标题来搜索" aria-label="搜索终端会话">
      </div>
    </div>

    <!-- 页面内容 -->
    <section class="space-y-3 px-4 pb-6 pt-1">
      <!-- 欢迎提示卡 -->
      <article class="miuix-card tu-surface-variant relative overflow-hidden p-5">
        <button data-dom-id="welcome-close" class="absolute right-3 top-3 z-10 flex h-8 w-8 items-center justify-center rounded-full tu-text-variant transition-opacity active:opacity-60" aria-label="关闭欢迎提示">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
        <div class="relative z-10 flex items-start gap-4 pr-6">
          <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-[var(--tu-secondary)] dark:bg-[var(--tu-secondary-dark)]">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="tu-text-variant">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="16" x2="12" y2="12"></line>
              <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
          </div>
          <p class="text-[15px] font-medium leading-relaxed">
            欢迎来到 Termux Ultra！点击右上角“+”新建终端会话，开始你的命令行之旅。
          </p>
        </div>
        <div class="pointer-events-none absolute -bottom-4 -right-4 z-0 opacity-[0.08]">
          <svg width="140" height="140" viewBox="0 0 24 24" fill="currentColor" class="tu-text-variant">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"></path>
          </svg>
        </div>
      </article>

      <!-- 服务状态卡 -->
      <article data-dom-id="service-status-card" class="miuix-card status-success relative overflow-hidden p-5">
        <div class="relative z-10">
          <div class="flex items-center gap-2">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--tu-success)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
              <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
            <h2 class="text-lg font-semibold">服务运行正常</h2>
          </div>
          <p class="mt-1.5 text-sm font-medium leading-relaxed opacity-90">
            Termux 后台服务正在运行，所有终端会话均可正常交互。
          </p>
        </div>
        <div class="pointer-events-none absolute -bottom-5 -right-5 z-0 opacity-[0.12]">
          <svg width="140" height="140" viewBox="0 0 24 24" fill="currentColor" class="text-[var(--tu-success)]">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"></path>
          </svg>
        </div>
      </article>

      <!-- 状态色示意芯片 -->
      <div class="grid grid-cols-3 gap-2">
        <div class="miuix-card status-success flex items-center justify-center gap-2 py-3">
          <span class="h-2 w-2 rounded-full status-dot-success"></span>
          <span class="text-xs font-medium">正常</span>
        </div>
        <div class="miuix-card status-warning flex items-center justify-center gap-2 py-3">
          <span class="h-2 w-2 rounded-full status-dot-warning"></span>
          <span class="text-xs font-medium">警告</span>
        </div>
        <div class="miuix-card status-error flex items-center justify-center gap-2 py-3">
          <span class="h-2 w-2 rounded-full status-dot-error"></span>
          <span class="text-xs font-medium">异常</span>
        </div>
      </div>

      <!-- 终端会话卡片网格 -->
      <div class="grid grid-cols-2 gap-3">
        <!-- 会话 1 -->
        <article data-dom-id="session-card-1" class="miuix-card flex flex-col justify-between p-4 active:scale-[0.98] transition-transform">
          <div class="flex items-center gap-3">
            <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl tu-surface-variant">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--tu-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="4 17 10 11 4 5"></polyline>
                <line x1="12" y1="19" x2="20" y2="19"></line>
              </svg>
            </div>
            <span class="truncate text-base font-bold">终端 1</span>
          </div>
          <div class="mt-4 flex justify-end gap-2">
            <button data-dom-id="rename-session-1" class="miuix-btn miuix-btn-primary h-9 w-9 p-0" aria-label="重命名">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
              </svg>
            </button>
            <button data-dom-id="stop-session-1" class="miuix-btn miuix-btn-primary h-9 w-9 p-0" aria-label="停止">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
            </button>
          </div>
        </article>

        <!-- 会话 2 -->
        <article data-dom-id="session-card-2" class="miuix-card flex flex-col justify-between p-4 active:scale-[0.98] transition-transform">
          <div class="flex items-center gap-3">
            <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl tu-surface-variant">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--tu-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="4 17 10 11 4 5"></polyline>
                <line x1="12" y1="19" x2="20" y2="19"></line>
              </svg>
            </div>
            <span class="truncate text-base font-bold">bash</span>
          </div>
          <div class="mt-4 flex justify-end gap-2">
            <button data-dom-id="rename-session-2" class="miuix-btn miuix-btn-primary h-9 w-9 p-0" aria-label="重命名">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
              </svg>
            </button>
            <button data-dom-id="stop-session-2" class="miuix-btn miuix-btn-primary h-9 w-9 p-0" aria-label="停止">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
            </button>
          </div>
        </article>

        <!-- 会话 3 -->
        <article data-dom-id="session-card-3" class="miuix-card flex flex-col justify-between p-4 active:scale-[0.98] transition-transform">
          <div class="flex items-center gap-3">
            <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl tu-surface-variant">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--tu-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="4 17 10 11 4 5"></polyline>
                <line x1="12" y1="19" x2="20" y2="19"></line>
              </svg>
            </div>
            <span class="truncate text-base font-bold">ssh-kali</span>
          </div>
          <div class="mt-4 flex justify-end gap-2">
            <button data-dom-id="rename-session-3" class="miuix-btn miuix-btn-primary h-9 w-9 p-0" aria-label="重命名">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
              </svg>
            </button>
            <button data-dom-id="stop-session-3" class="miuix-btn miuix-btn-primary h-9 w-9 p-0" aria-label="停止">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
            </button>
          </div>
        </article>

        <!-- 会话 4 -->
        <article data-dom-id="session-card-4" class="miuix-card flex flex-col justify-between p-4 active:scale-[0.98] transition-transform">
          <div class="flex items-center gap-3">
            <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl tu-surface-variant">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--tu-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="4 17 10 11 4 5"></polyline>
                <line x1="12" y1="19" x2="20" y2="19"></line>
              </svg>
            </div>
            <span class="truncate text-base font-bold">python</span>
          </div>
          <div class="mt-4 flex justify-end gap-2">
            <button data-dom-id="rename-session-4" class="miuix-btn miuix-btn-primary h-9 w-9 p-0" aria-label="重命名">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
              </svg>
            </button>
            <button data-dom-id="stop-session-4" class="miuix-btn miuix-btn-primary h-9 w-9 p-0" aria-label="停止">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
            </button>
          </div>
        </article>
      </div>
    </section>
  </main>

  <!-- 底部导航占位 -->
  <nav class="fixed bottom-0 left-0 right-0 z-50 flex h-16 items-center justify-around border-t border-[var(--tu-border)] bg-[var(--tu-surface)] dark:border-[var(--tu-border-dark)] dark:bg-[var(--tu-surface-dark)]" style="padding-bottom: env(safe-area-inset-bottom);">
    <button data-dom-id="nav-terminal" class="flex flex-1 flex-col items-center justify-center gap-1 text-[var(--tu-primary)]" aria-label="终端">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="4 17 10 11 4 5"></polyline>
        <line x1="12" y1="19" x2="20" y2="19"></line>
      </svg>
      <span class="text-[11px] font-medium">终端</span>
    </button>
    <button data-dom-id="nav-files" class="flex flex-1 flex-col items-center justify-center gap-1 tu-text-variant" aria-label="文件">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
      </svg>
      <span class="text-[11px] font-medium">文件</span>
    </button>
    <button data-dom-id="nav-remote" class="flex flex-1 flex-col items-center justify-center gap-1 tu-text-variant" aria-label="远程">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
        <line x1="8" y1="21" x2="16" y2="21"></line>
        <line x1="12" y1="17" x2="12" y2="21"></line>
      </svg>
      <span class="text-[11px] font-medium">远程</span>
    </button>
    <button data-dom-id="nav-resources" class="flex flex-1 flex-col items-center justify-center gap-1 tu-text-variant" aria-label="资源">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
        <polyline points="10 9 9 9 8 9"></polyline>
      </svg>
      <span class="text-[11px] font-medium">资源</span>
    </button>
    <button data-dom-id="nav-settings" class="flex flex-1 flex-col items-center justify-center gap-1 tu-text-variant" aria-label="设置">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
      <span class="text-[11px] font-medium">设置</span>
    </button>
  </nav>
</body>
</html>
