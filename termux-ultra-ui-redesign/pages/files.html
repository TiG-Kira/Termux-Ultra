<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Termux Ultra — 文件</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style id="theme-vars">
    :root {
      --termux-primary: #2563EB;
      --termux-primary-foreground: #FFFFFF;
      --termux-primary-hover: #1D4ED8;
      --termux-background: #F5F5F5;
      --termux-background-dark: #121212;
      --termux-surface: #FFFFFF;
      --termux-surface-dark: #1A1A1A;
      --termux-surface-variant: #F0F0F0;
      --termux-surface-variant-dark: #2C2C2C;
      --termux-on-surface: #1A1A1A;
      --termux-on-surface-dark: #FFFFFF;
      --termux-on-surface-variant: #666666;
      --termux-on-surface-variant-dark: #AAAAAA;
      --termux-on-surface-summary: #888888;
      --termux-on-surface-summary-dark: #999999;
      --termux-success: #36D167;
      --termux-success-container: #DFFAE4;
      --termux-success-container-dark: #1A3825;
      --termux-error: #FF5252;
      --termux-error-container: #FFEBEE;
      --termux-error-container-dark: #3B1414;
      --termux-warning: #FDD835;
      --termux-warning-container: #FFF9C4;
      --termux-warning-container-dark: #3D3514;
      --termux-border: #E0E0E0;
      --termux-border-dark: #333333;
      --termux-input: #FFFFFF;
      --termux-input-dark: #2C2C2C;
      --termux-ring: #2563EB;
      --termux-muted: #F5F5F5;
      --termux-muted-dark: #2C2C2C;
      --termux-secondary: #E0E0E0;
      --termux-secondary-dark: #424242;
      --termux-secondary-foreground: #1A1A1A;
      --termux-secondary-foreground-dark: #FFFFFF;
      --termux-radius-sm: 8px;
      --termux-radius-md: 12px;
      --termux-radius-lg: 16px;
      --termux-radius-xl: 20px;
      --termux-radius-2xl: 24px;
      --termux-page-horizontal: 16px;
      --termux-page-bottom: 96px;
      --termux-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      --termux-font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
    }
    * { font-family: var(--termux-font-family); -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background-color: var(--termux-background); color: var(--termux-on-surface); }
    .dark body { background-color: var(--termux-background-dark); color: var(--termux-on-surface-dark); }
  </style>
</head>
<body class="antialiased">
  <main id="main-content" data-page="files" class="min-h-screen pb-24">
    <style>
      .files-bg { background-color: var(--termux-background); }
      .dark .files-bg { background-color: var(--termux-background-dark); }
      .files-surface { background-color: var(--termux-surface); }
      .dark .files-surface { background-color: var(--termux-surface-dark); }
      .files-surface-variant { background-color: var(--termux-surface-variant); }
      .dark .files-surface-variant { background-color: var(--termux-surface-variant-dark); }
      .files-on-surface { color: var(--termux-on-surface); }
      .dark .files-on-surface { color: var(--termux-on-surface-dark); }
      .files-on-surface-variant { color: var(--termux-on-surface-variant); }
      .dark .files-on-surface-variant { color: var(--termux-on-surface-variant-dark); }
      .files-on-surface-summary { color: var(--termux-on-surface-summary); }
      .dark .files-on-surface-summary { color: var(--termux-on-surface-summary-dark); }
      .files-warning-bg { background-color: var(--termux-warning-container); }
      .dark .files-warning-bg { background-color: var(--termux-warning-container-dark); }
      .files-warning-text { color: var(--termux-on-surface); }
      .dark .files-warning-text { color: var(--termux-on-surface-dark); }
      .files-primary { color: var(--termux-primary); }
      .files-primary-bg { background-color: var(--termux-primary); }
      .files-primary-soft { background-color: rgba(37, 99, 235, 0.12); }
      .dark .files-primary-soft { background-color: rgba(37, 99, 235, 0.20); }
      .files-selected { background-color: var(--termux-surface-variant); }
      .dark .files-selected { background-color: var(--termux-surface-variant-dark); }
      .files-border { border-color: var(--termux-border); }
      .dark .files-border { border-color: var(--termux-border-dark); }
      .files-input { background-color: var(--termux-input); }
      .dark .files-input { background-color: var(--termux-input-dark); }

      .ftp-switch-checkbox:checked + .ftp-switch-track { background-color: var(--termux-primary); }
      .ftp-switch-checkbox:checked + .ftp-switch-track .ftp-switch-thumb { transform: translateX(20px); }

      .file-checkbox:checked { background-color: var(--termux-primary); border-color: var(--termux-primary); }
      .file-checkbox:checked::after { content: ''; display: block; width: 5px; height: 9px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); margin: 2px 0 0 5px; }

      .bottom-sheet[open] .bottom-sheet-chevron { transform: rotate(180deg); }
      .bottom-sheet-content { max-height: 0; overflow: hidden; transition: max-height 0.25s ease; }
      .bottom-sheet[open] .bottom-sheet-content { max-height: 520px; }
    </style>

    <!-- TopAppBar -->
    <header class="fixed top-0 inset-x-0 z-50 h-14 flex items-center justify-between px-1 files-bg/80 backdrop-blur-md">
      <div class="flex items-center">
        <button class="w-10 h-10 flex items-center justify-center rounded-full active:files-surface-variant transition-colors files-on-surface-variant" aria-label="返回上级">
          <svg viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
        </button>
        <button class="w-10 h-10 flex items-center justify-center rounded-full active:files-surface-variant transition-colors files-on-surface-summary" aria-label="前进" disabled>
          <svg viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
        </button>
      </div>
      <h1 class="absolute left-1/2 -translate-x-1/2 text-base font-medium files-on-surface">文件</h1>
      <div class="flex items-center gap-1 pr-1">
        <button class="w-10 h-10 flex items-center justify-center rounded-full active:files-surface-variant transition-colors files-on-surface" aria-label="FTP 信息">
          <svg viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg>
        </button>
        <label class="relative inline-flex items-center cursor-pointer" data-dom-id="ftp-toggle">
          <input type="checkbox" class="ftp-switch-checkbox sr-only">
          <span class="ftp-switch-track w-11 h-6 rounded-full files-surface-variant transition-colors duration-200">
            <span class="ftp-switch-thumb absolute top-1 left-1 w-4 h-4 rounded-full files-surface shadow-sm transition-transform duration-200"></span>
          </span>
        </label>
        <button class="w-10 h-10 flex items-center justify-center rounded-full active:files-surface-variant transition-colors files-on-surface" data-dom-id="new-file" aria-label="新建">
          <svg viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </button>
      </div>
    </header>

    <!-- Page content -->
    <div class="pt-16 px-4 space-y-2">

      <!-- Warning card -->
      <section class="files-surface rounded-[var(--termux-radius-lg)] p-4 flex items-start gap-3 shadow-sm">
        <div class="w-9 h-9 rounded-full files-primary-soft flex items-center justify-center flex-shrink-0">
          <svg viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 files-primary"><path d="M11 7h2v6h-2V7zm0 8h2v2h-2v-2zm-1-13L1 21h22L12 2zm0 3.8L19.2 19H4.8L12 5.8z"/></svg>
        </div>
        <p class="flex-1 text-sm leading-5 files-warning-text">
          文件管理操作具有风险，删除或修改系统文件可能导致应用无法正常工作。请谨慎操作。
        </p>
        <button class="w-8 h-8 flex items-center justify-center rounded-full active:files-surface-variant transition-colors files-on-surface-summary flex-shrink-0" aria-label="关闭警告">
          <svg viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </section>

      <!-- Path breadcrumb card -->
      <section class="files-surface rounded-[var(--termux-radius-md)] px-3.5 py-3 flex items-center gap-2 shadow-sm" data-dom-id="path-breadcrumb">
        <svg viewBox="0 0 24 24" fill="currentColor" class="w-[18px] h-[18px] files-on-surface-summary flex-shrink-0"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
        <span class="text-[13px] font-medium truncate files-on-surface-summary" style="font-family: var(--termux-font-mono);">/data/data/com.termux/files</span>
      </section>

      <!-- File list -->
      <section class="space-y-2" aria-label="文件列表">

        <!-- Folder item (selection mode checked) -->
        <article class="files-surface rounded-[var(--termux-radius-lg)] p-3.5 flex items-center gap-3 shadow-sm active:opacity-90 transition-opacity files-selected" data-dom-id="folder-item-1">
          <input type="checkbox" class="file-checkbox w-5 h-5 rounded border-2 files-border files-input cursor-pointer appearance-none" checked aria-label="选择 bin">
          <div class="w-[42px] h-[42px] rounded-[10px] files-primary-soft flex items-center justify-center flex-shrink-0">
            <svg viewBox="0 0 24 24" fill="currentColor" class="w-[22px] h-[22px] files-primary"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
          </div>
          <div class="flex-1 min-w-0">
            <h3 class="text-[15px] font-bold leading-5 truncate files-on-surface">bin</h3>
            <p class="text-xs leading-4 files-on-surface-summary mt-0.5">12 项</p>
          </div>
        </article>

        <!-- File item (selection mode unchecked) -->
        <article class="files-surface rounded-[var(--termux-radius-lg)] p-3.5 flex items-center gap-3 shadow-sm active:opacity-90 transition-opacity" data-dom-id="file-item-1">
          <input type="checkbox" class="file-checkbox w-5 h-5 rounded border-2 files-border files-input cursor-pointer appearance-none" aria-label="选择 bootstrap.sh">
          <div class="w-[42px] h-[42px] rounded-[10px] files-surface-variant flex items-center justify-center flex-shrink-0">
            <svg viewBox="0 0 24 24" fill="currentColor" class="w-[22px] h-[22px] files-on-surface"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
          </div>
          <div class="flex-1 min-w-0">
            <h3 class="text-[15px] font-bold leading-5 truncate files-on-surface">bootstrap.sh</h3>
            <p class="text-xs leading-4 files-on-surface-summary mt-0.5">1.24 KB · 2026-07-28 14:32</p>
          </div>
        </article>

        <!-- File item -->
        <article class="files-surface rounded-[var(--termux-radius-lg)] p-3.5 flex items-center gap-3 shadow-sm active:opacity-90 transition-opacity" data-dom-id="file-item-2">
          <div class="w-[42px] h-[42px] rounded-[10px] files-surface-variant flex items-center justify-center flex-shrink-0">
            <svg viewBox="0 0 24 24" fill="currentColor" class="w-[22px] h-[22px] files-on-surface"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
          </div>
          <div class="flex-1 min-w-0">
            <h3 class="text-[15px] font-bold leading-5 truncate files-on-surface">README.md</h3>
            <p class="text-xs leading-4 files-on-surface-summary mt-0.5">3.68 KB · 2026-07-25 09:15</p>
          </div>
        </article>

        <!-- Folder item (normal mode) -->
        <article class="files-surface rounded-[var(--termux-radius-lg)] p-3.5 flex items-center gap-3 shadow-sm active:opacity-90 transition-opacity">
          <div class="w-[42px] h-[42px] rounded-[10px] files-primary-soft flex items-center justify-center flex-shrink-0">
            <svg viewBox="0 0 24 24" fill="currentColor" class="w-[22px] h-[22px] files-primary"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
          </div>
          <div class="flex-1 min-w-0">
            <h3 class="text-[15px] font-bold leading-5 truncate files-on-surface">home</h3>
            <p class="text-xs leading-4 files-on-surface-summary mt-0.5">5 项</p>
          </div>
          <button class="w-8 h-8 flex items-center justify-center rounded-full active:files-surface-variant transition-colors files-on-surface-summary" aria-label="打开 home">
            <svg viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
          </button>
        </article>

      </section>

      <!-- Empty folder state -->
      <section class="files-surface rounded-[var(--termux-radius-lg)] py-20 flex flex-col items-center justify-center shadow-sm">
        <svg viewBox="0 0 24 24" fill="currentColor" class="w-12 h-12 files-on-surface-summary mb-3"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg>
        <p class="text-[15px] font-medium files-on-surface-summary">空文件夹</p>
      </section>

      <!-- File open BottomSheet (collapsible design draft) -->
      <details class="bottom-sheet files-surface rounded-t-[var(--termux-radius-xl)] shadow-[0_-4px_20px_rgba(0,0,0,0.08)] overflow-hidden" data-dom-id="open-with-sheet" open>
        <summary class="list-none cursor-pointer">
          <div class="flex items-center justify-between px-4 pt-3 pb-2">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl files-surface-variant flex items-center justify-center">
                <svg viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 files-on-surface"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
              </div>
              <div>
                <h4 class="text-[15px] font-bold files-on-surface">bootstrap.sh</h4>
                <p class="text-xs files-on-surface-summary">1.24 KB · Shell 脚本</p>
              </div>
            </div>
            <svg viewBox="0 0 24 24" fill="currentColor" class="bottom-sheet-chevron w-6 h-6 files-on-surface-summary transition-transform duration-200"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
          </div>
        </summary>
        <div class="bottom-sheet-content px-2 pb-4">
          <!-- Shell script warning -->
          <div class="files-warning-bg rounded-[var(--termux-radius-md)] mx-2 mb-2 px-3 py-2.5">
            <p class="text-xs leading-5 files-warning-text">该文件是 Shell 脚本，执行前请确认来源可信。</p>
          </div>
          <p class="px-4 pt-1 pb-1 text-sm files-on-surface">选择打开方式</p>
          <button class="w-full flex items-center gap-4 px-4 py-3 rounded-[var(--termux-radius-md)] active:files-surface-variant transition-colors files-on-surface" data-dom-id="view-content">
            <svg viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
            <span class="text-[15px]">查看内容</span>
          </button>
          <button class="w-full flex items-center gap-4 px-4 py-3 rounded-[var(--termux-radius-md)] active:files-surface-variant transition-colors files-on-surface" data-dom-id="edit-file">
            <svg viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
            <span class="text-[15px]">编辑文件</span>
          </button>
          <button class="w-full flex items-center gap-4 px-4 py-3 rounded-[var(--termux-radius-md)] active:files-surface-variant transition-colors files-on-surface" data-dom-id="execute-bash">
            <svg viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V6h16v12zM7.5 15.5l-1.4-1.4L8.8 11.5 6.1 8.8l1.4-1.4 4.2 4.2-4.2 4.9zm5.5-.5h5v2h-5v-2z"/></svg>
            <span class="text-[15px]">执行 Bash</span>
          </button>
          <button class="w-full flex items-center gap-4 px-4 py-3 rounded-[var(--termux-radius-md)] active:files-surface-variant transition-colors files-on-surface">
            <svg viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
            <span class="text-[15px]">复制执行命令</span>
          </button>
          <button class="w-full flex items-center gap-4 px-4 py-3 rounded-[var(--termux-radius-md)] active:files-surface-variant transition-colors files-on-surface">
            <svg viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
            <span class="text-[15px]">复制路径</span>
          </button>
          <button class="w-full flex items-center gap-4 px-4 py-3 rounded-[var(--termux-radius-md)] active:files-surface-variant transition-colors files-on-surface">
            <svg viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
            <span class="text-[15px]">用其他方式打开</span>
          </button>
          <button class="w-full mt-2 py-2.5 text-center text-sm font-medium files-primary rounded-[var(--termux-radius-md)] active:opacity-80 transition-opacity" onclick="document.querySelector('.bottom-sheet').removeAttribute('open')">取消</button>
        </div>
      </details>

    </div>
  </main>
</body>
</html>
