<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Termux Ultra — 资源</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style id="theme-vars">
    :root {
      --termux-primary: #2563EB;
      --termux-primary-foreground: #FFFFFF;
      --termux-primary-hover: #1D4ED8;
      --termux-background: #F5F5F5;
      --termux-background-dark: #121212;
      --termux-surface: #FFFFFF;
      --termux-surface-dark: #1A1A1A;
      --termux-surface-variant: #F0F0F0;
      --termux-surface-variant-dark: #2C2C2C;
      --termux-on-surface: #1A1A1A;
      --termux-on-surface-dark: #FFFFFF;
      --termux-on-surface-variant: #666666;
      --termux-on-surface-variant-dark: #AAAAAA;
      --termux-on-surface-summary: #888888;
      --termux-on-surface-summary-dark: #999999;
      --termux-success: #36D167;
      --termux-success-container: #DFFAE4;
      --termux-success-container-dark: #1A3825;
      --termux-error: #FF5252;
      --termux-error-container: #FFEBEE;
      --termux-error-container-dark: #3B1414;
      --termux-warning: #FDD835;
      --termux-warning-container: #FFF9C4;
      --termux-warning-container-dark: #3D3514;
      --termux-border: #E0E0E0;
      --termux-border-dark: #333333;
      --termux-input: #FFFFFF;
      --termux-input-dark: #2C2C2C;
      --termux-ring: #2563EB;
      --termux-muted: #F5F5F5;
      --termux-muted-dark: #2C2C2C;
      --termux-secondary: #E0E0E0;
      --termux-secondary-dark: #424242;
      --termux-secondary-foreground: #1A1A1A;
      --termux-secondary-foreground-dark: #FFFFFF;
      --termux-radius-sm: 8px;
      --termux-radius-md: 12px;
      --termux-radius-lg: 16px;
      --termux-radius-xl: 20px;
      --termux-radius-2xl: 24px;
      --termux-page-horizontal: 16px;
      --termux-page-bottom: 96px;
      --termux-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      --termux-font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
    }
    * { font-family: var(--termux-font-family); -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background-color: var(--termux-background); color: var(--termux-on-surface); }
    .dark body { background-color: var(--termux-background-dark); color: var(--termux-on-surface-dark); }
  </style>
</head>
<body class="antialiased">
  <main id="main-content" data-page="resources" class="min-h-screen pb-24">
    <style>
      #main-content {
        --tu-surface: var(--termux-surface);
        --tu-surface-variant: var(--termux-surface-variant);
        --tu-on-surface: var(--termux-on-surface);
        --tu-on-surface-variant: var(--termux-on-surface-variant);
        --tu-on-surface-summary: var(--termux-on-surface-summary);
        --tu-secondary-bg: var(--termux-secondary);
        --tu-secondary-text: var(--termux-secondary-foreground);
        --tu-primary-15: rgba(37, 99, 235, 0.15);
        --tu-third-party-15: rgba(124, 77, 255, 0.15);
        --tu-warning-icon-bg: rgba(255, 160, 0, 0.12);
        --tu-warning-icon: #FFA000;
      }
      .dark #main-content {
        --tu-surface: var(--termux-surface-dark);
        --tu-surface-variant: var(--termux-surface-variant-dark);
        --tu-on-surface: var(--termux-on-surface-dark);
        --tu-on-surface-variant: var(--termux-on-surface-variant-dark);
        --tu-on-surface-summary: var(--termux-on-surface-summary-dark);
        --tu-secondary-bg: var(--termux-secondary-dark);
        --tu-secondary-text: var(--termux-secondary-foreground-dark);
      }
    </style>

    <section class="px-4 py-2 space-y-6">
      <!-- Hero 欢迎卡片 -->
      <div data-dom-id="hero-welcome" class="relative overflow-hidden rounded-3xl p-5 text-white shadow-sm" style="background: linear-gradient(135deg, #2563EB 0%, #4F46E5 50%, #7C3AED 100%);">
        <div class="pointer-events-none absolute right-8 -top-10 h-28 w-28 rounded-full bg-white opacity-10"></div>
        <div class="relative z-10">
          <p class="mb-1 text-xs font-medium opacity-80">Termux Ultra</p>
          <h1 class="mb-2 text-2xl font-bold">资源中心</h1>
          <p class="text-sm font-medium leading-relaxed opacity-85">探索 Termux Ultra 资源与工具</p>
        </div>
      </div>

      <!-- 快速入口 -->
      <div>
        <h2 class="mb-2 px-4 text-xs font-semibold" style="color: var(--tu-on-surface-summary);">快速入口</h2>
        <div class="grid grid-cols-2 gap-3">
          <!-- 工具中心 -->
          <button data-dom-id="utility-center" type="button" class="flex cursor-pointer flex-col items-center rounded-2xl p-4 text-center transition-transform active:scale-95" style="background-color: var(--tu-surface);">
            <div class="mb-3 flex h-11 w-11 items-center justify-center rounded-xl" style="background-color: var(--tu-primary-15);">
              <svg class="h-6 w-6" style="color: var(--termux-primary);" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            </div>
            <h3 class="mb-1 text-[15px] font-bold leading-tight" style="color: var(--tu-on-surface);">工具中心</h3>
            <p class="mb-3 text-xs leading-relaxed" style="color: var(--tu-on-surface-variant);">官方维护</p>
            <span class="inline-flex items-center text-[13px] font-semibold" style="color: var(--termux-primary);">
              进入
              <svg class="ml-0.5 h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
              </svg>
            </span>
          </button>

          <!-- 第三方资源中心 -->
          <button data-dom-id="third-party-center" type="button" class="flex cursor-pointer flex-col items-center rounded-2xl p-4 text-center transition-transform active:scale-95" style="background-color: var(--tu-surface);">
            <div class="mb-3 flex h-11 w-11 items-center justify-center rounded-xl" style="background-color: var(--tu-third-party-15);">
              <svg class="h-6 w-6" style="color: #7C4DFF;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
              </svg>
            </div>
            <h3 class="mb-1 text-[15px] font-bold leading-tight" style="color: var(--tu-on-surface);">第三方资源中心</h3>
            <p class="mb-3 text-xs leading-relaxed" style="color: var(--tu-on-surface-variant);">第三方维护</p>
            <span class="inline-flex items-center text-[13px] font-semibold" style="color: #7C4DFF;">
              进入
              <svg class="ml-0.5 h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
              </svg>
            </span>
          </button>
        </div>
      </div>

      <!-- 资源提示 -->
      <div>
        <h2 class="mb-2 px-4 text-xs font-semibold" style="color: var(--tu-on-surface-summary);">资源提示</h2>
        <div data-dom-id="warning-note" class="flex items-start gap-3 rounded-2xl p-4" style="background-color: var(--tu-surface);">
          <div class="flex h-8 w-8 flex-shrink-0 items-center justify-center rounded-full" style="background-color: var(--tu-warning-icon-bg);">
            <svg class="h-[18px] w-[18px]" style="color: var(--tu-warning-icon);" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </div>
          <p class="text-[13px] leading-5" style="color: var(--tu-on-surface-variant);">
            资源中心内容由社区与官方共同维护，第三方脚本请自行评估风险后使用。
          </p>
        </div>
      </div>

      <!-- 资源列表示例 -->
      <div>
        <h2 class="mb-2 px-4 text-xs font-semibold" style="color: var(--tu-on-surface-summary);">资源列表</h2>

        <div data-dom-id="resource-card-1" class="overflow-hidden rounded-2xl" style="background-color: var(--tu-surface);">
          <!-- 头部 -->
          <div class="flex items-center p-4">
            <div class="flex h-12 w-12 flex-shrink-0 items-center justify-center rounded-xl" style="background-color: var(--termux-primary);">
              <svg class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
              </svg>
            </div>
            <div class="ml-3 min-w-0 flex-1">
              <h3 class="mb-0.5 truncate text-base font-bold" style="color: var(--tu-on-surface);">Ubuntu 容器安装</h3>
              <p class="text-[13px] leading-snug" style="color: var(--tu-on-surface-variant);">一键部署 Debian/Ubuntu 容器环境</p>
            </div>
          </div>

          <!-- 分隔线 -->
          <div class="mx-4 h-px" style="background-color: var(--tu-on-surface); opacity: 0.1;"></div>

          <!-- 操作按钮 -->
          <div class="flex justify-end gap-2 p-3">
            <button data-dom-id="explain-btn" type="button" class="rounded-lg px-3 py-1.5 text-xs font-bold" style="background-color: var(--tu-secondary-bg); color: var(--tu-secondary-text);">
              说明
            </button>
            <button data-dom-id="copy-command-btn" type="button" class="inline-flex items-center gap-1 rounded-lg px-3 py-1.5 text-xs font-bold text-white" style="background-color: var(--termux-primary);">
              <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
              </svg>
              复制指令
            </button>
          </div>

          <!-- 展开执行选项 -->
          <div class="px-4 pb-4">
            <div class="rounded-xl p-3 space-y-2" style="background-color: var(--tu-surface);">
              <h4 class="mb-2 text-sm font-bold" style="color: var(--tu-on-surface);">选择执行方式</h4>
              <button data-dom-id="execute-new-session" type="button" class="inline-flex w-full items-center justify-center gap-2 rounded-xl py-2.5 text-[13px] font-bold text-white" style="background-color: var(--termux-primary);">
                <svg class="h-[18px] w-[18px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                在新会话执行
              </button>
              <button data-dom-id="execute-tmux" type="button" class="inline-flex w-full items-center justify-center gap-2 rounded-xl py-2.5 text-[13px] font-bold" style="background-color: var(--tu-surface-variant); color: var(--tu-on-surface);">
                <svg class="h-[18px] w-[18px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                在新会话执行 (tmux)
              </button>
              <p class="pt-1 text-[13px] font-bold" style="color: var(--tu-on-surface-summary);">在运行的会话内执行:</p>
              <button type="button" class="inline-flex w-full items-center justify-center gap-2 rounded-xl py-2.5 text-[13px] font-bold" style="background-color: var(--tu-surface-variant); color: var(--tu-on-surface);">
                <svg class="h-[18px] w-[18px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                复制到 "Terminal-1"
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
