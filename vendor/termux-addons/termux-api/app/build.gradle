apply plugin: 'com.android.library'

android {
    namespace "com.termux.api"
    compileSdk project.properties.compileSdkVersion.toInteger()

    defaultConfig {
        minSdk project.properties.minSdkVersion.toInteger()
        targetSdk project.properties.targetSdkVersion.toInteger()
        manifestPlaceholders.TERMUX_PACKAGE_NAME = "com.termux"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Themes (DialogTheme/TransparentTheme extend Theme.AppCompat.*)
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    // 不要升级 androidx.biometric！1.4.0-alpha07 把 FingerprintDialogFragment 移入
    // androidx.biometric.internal.*，主 app 的 DeviceAuthPrompt 仍按旧包名引用它，
    // 升级会在 VncActivity.onCreate 抛 NoClassDefFoundError（VNC 页面白屏）。
    // 详见 .github/dependabot.yml 的 ignore 规则。
    implementation 'androidx.biometric:biometric:1.2.0-alpha05'
    implementation 'androidx.media:media:1.8.0'

    implementation project(':termux-shared')
}
