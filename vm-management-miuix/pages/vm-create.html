<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新建虚拟机</title>
    <style id="theme-vars">
:root {
  --miuix-primary: #3482FF;
  --miuix-primary-foreground: #FFFFFF;
  --miuix-primary-50: #EDF4FF;
  --miuix-primary-100: #DBEAFF;
  --miuix-primary-600: #1A68E5;
  --miuix-neutral-50: #F7F7F8;
  --miuix-neutral-100: #F2F2F3;
  --miuix-neutral-200: #E5E5E7;
  --miuix-neutral-300: #D4D4D8;
  --miuix-neutral-400: #A1A1AA;
  --miuix-neutral-500: #71717A;
  --miuix-neutral-900: #18181B;
  --miuix-background: #FFFFFF;
  --miuix-foreground: #111111;
  --miuix-card: #FFFFFF;
  --miuix-card-foreground: #111111;
  --miuix-popover: #FFFFFF;
  --miuix-popover-foreground: #111111;
  --miuix-muted: #F7F7F8;
  --miuix-muted-foreground: #71717A;
  --miuix-border: #E5E5E7;
  --miuix-input: #F2F2F3;
  --miuix-ring: #3482FF;
  --miuix-state-success: #34C759;
  --miuix-state-success-bg: #E8F9ED;
  --miuix-state-warning: #FF9500;
  --miuix-state-warning-bg: #FFF4E5;
  --miuix-state-error: #FF3B30;
  --miuix-state-error-bg: #FFEBEA;
  --miuix-state-info: #3482FF;
  --miuix-state-info-bg: #EDF4FF;
  --miuix-radius-small: 4px;
  --miuix-radius-medium: 8px;
  --miuix-radius-large: 16px;
  --miuix-radius-pill: 999px;
  --miuix-shadow-1: 0 1px 2px rgba(15, 23, 42, 0.04), 0 1px 1px rgba(15, 23, 42, 0.02);
  --miuix-shadow-2: 0 4px 12px -4px rgba(15, 23, 42, 0.10);
  --miuix-shadow-3: 0 16px 40px -12px rgba(15, 23, 42, 0.22);
  --miuix-space-1: 4px;
  --miuix-space-2: 8px;
  --miuix-space-3: 12px;
  --miuix-space-4: 16px;
  --miuix-space-5: 24px;
  --miuix-font-sans: "Inter", "MiSans", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  --miuix-font-mono: "SF Mono", "Fira Code", "JetBrains Mono", ui-monospace, monospace;
  --miuix-text-xs: 12px;
  --miuix-text-sm: 13px;
  --miuix-text-base: 15px;
  --miuix-text-lg: 17px;
  --miuix-text-xl: 20px;
  --miuix-text-2xl: 24px;
  --miuix-header-height: 56px;
  --miuix-list-row-height: 80px;
  --miuix-button-height: 40px;
  --miuix-input-height: 44px;
}
.miuix-h1 { font-size: var(--miuix-text-2xl); font-weight: 700; line-height: 1.15; letter-spacing: -0.015em; }
.miuix-h2 { font-size: var(--miuix-text-xl); font-weight: 600; line-height: 1.2; }
.miuix-h3 { font-size: var(--miuix-text-lg); font-weight: 600; line-height: 1.25; }
.miuix-body { font-size: var(--miuix-text-base); line-height: 1.5; }
.miuix-body-sm { font-size: var(--miuix-text-sm); line-height: 1.5; }
.miuix-caption { font-size: var(--miuix-text-xs); line-height: 1.4; }
.miuix-text-secondary { color: var(--miuix-muted-foreground); }
.miuix-text-tertiary { color: var(--miuix-neutral-400); }
.miuix-text-success { color: var(--miuix-state-success); }
.miuix-text-warning { color: var(--miuix-state-warning); }
.miuix-surface-muted { background-color: var(--miuix-muted); }
.miuix-badge { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; font-size: var(--miuix-text-xs); font-weight: 600; border-radius: var(--miuix-radius-pill); white-space: nowrap; }
.miuix-badge-success { background-color: var(--miuix-state-success-bg); color: var(--miuix-state-success); }
.miuix-badge-warning { background-color: var(--miuix-state-warning-bg); color: var(--miuix-state-warning); }
.miuix-icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: var(--miuix-radius-medium); border: none; background-color: transparent; color: var(--miuix-muted-foreground); cursor: pointer; transition: background-color 120ms ease, color 120ms ease; }
.miuix-icon-btn:hover { background-color: var(--miuix-muted); color: var(--miuix-foreground); }
.miuix-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: var(--miuix-button-height); padding: 0 18px; font-size: var(--miuix-text-base); font-weight: 600; line-height: 1; border-radius: var(--miuix-radius-large); border: none; cursor: pointer; transition: transform 120ms cubic-bezier(.2,.8,.2,1), background-color 120ms cubic-bezier(.2,.8,.2,1); }
.miuix-btn:active { transform: scale(0.98); }
.miuix-btn-primary { background-color: var(--miuix-primary); color: var(--miuix-primary-foreground); }
.miuix-btn-primary:hover { background-color: var(--miuix-primary-600); }
.miuix-btn-secondary { background-color: var(--miuix-muted); color: var(--miuix-foreground); }
.miuix-input { width: 100%; height: var(--miuix-input-height); padding: 0 14px; font-size: var(--miuix-text-base); color: var(--miuix-foreground); background-color: var(--miuix-input); border: 1px solid transparent; border-radius: var(--miuix-radius-medium); outline: none; transition: border-color 120ms ease, box-shadow 120ms ease; }
.miuix-input::placeholder { color: var(--miuix-neutral-400); }
.miuix-input:focus { border-color: var(--miuix-primary); box-shadow: 0 0 0 3px var(--miuix-primary-50); }
.miuix-card { background-color: var(--miuix-card); border-radius: var(--miuix-radius-large); border: 1px solid var(--miuix-border); overflow: hidden; }
.miuix-scrim { position: fixed; inset: 0; background-color: rgba(0, 0, 0, 0.40); backdrop-filter: blur(2px); z-index: 40; }
.miuix-sheet { background-color: var(--miuix-popover); border-radius: var(--miuix-radius-large) var(--miuix-radius-large) 0 0; box-shadow: var(--miuix-shadow-3); }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--miuix-background);
        --color-foreground: var(--miuix-foreground);
        --color-card: var(--miuix-card);
        --color-card-foreground: var(--miuix-card-foreground);
        --color-popover: var(--miuix-popover);
        --color-popover-foreground: var(--miuix-popover-foreground);
        --color-primary: var(--miuix-primary);
        --color-primary-foreground: var(--miuix-primary-foreground);
        --color-muted: var(--miuix-muted);
        --color-muted-foreground: var(--miuix-muted-foreground);
        --color-border: var(--miuix-border);
        --color-input: var(--miuix-input);
        --color-ring: var(--miuix-ring);
        --radius-sm: var(--miuix-radius-small);
        --radius-md: var(--miuix-radius-medium);
        --radius-lg: var(--miuix-radius-large);
      }
      @layer base { body { background: var(--miuix-background); color: var(--miuix-foreground); } }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--miuix-background); }
      .text-foreground { color: var(--miuix-foreground); }
      .bg-card { background-color: var(--miuix-card); }
      .text-card-foreground { color: var(--miuix-card-foreground); }
      .bg-popover { background-color: var(--miuix-popover); }
      .text-popover-foreground { color: var(--miuix-popover-foreground); }
      .bg-primary { background-color: var(--miuix-primary); }
      .text-primary { color: var(--miuix-primary); }
      .text-primary-foreground { color: var(--miuix-primary-foreground); }
      .bg-muted { background-color: var(--miuix-muted); }
      .text-muted-foreground { color: var(--miuix-muted-foreground); }
      .border-border { border-color: var(--miuix-border); }
      .bg-input { background-color: var(--miuix-input); }
      .ring-ring { --tw-ring-color: var(--miuix-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen antialiased" style="font-family: var(--miuix-font-sans); background-color: var(--miuix-muted);">
    <main class="relative mx-auto w-full max-w-md min-h-screen bg-background shadow-2xl">
        <!-- Background: VM List (dimmed) -->
        <div class="pointer-events-none opacity-40">
            <header class="sticky top-0 z-20 flex h-14 items-center justify-between px-4 bg-background/95 backdrop-blur" style="border-bottom: 1px solid var(--miuix-border);">
                <div class="flex items-center gap-3">
                    <button class="miuix-icon-btn" aria-label="返回"><i data-lucide="chevron-left" class="h-5 w-5"></i></button>
                    <h1 class="miuix-h1">虚拟机</h1>
                </div>
                <div class="flex items-center gap-1">
                    <button class="miuix-icon-btn" aria-label="帮助"><i data-lucide="help-circle" class="h-5 w-5"></i></button>
                    <button class="miuix-icon-btn" aria-label="设置"><i data-lucide="settings" class="h-5 w-5"></i></button>
                </div>
            </header>
            <div class="p-4 space-y-4">
                <section class="miuix-card p-4" style="box-shadow: var(--miuix-shadow-1);">
                    <div class="flex items-center justify-between">
                        <div><p class="miuix-body-sm miuix-text-secondary">虚拟机总数</p><p class="miuix-h1 mt-1">4</p></div>
                        <div class="text-right"><p class="miuix-body-sm miuix-text-secondary">运行中</p><p class="miuix-h2 mt-1 miuix-text-success">2</p></div>
                    </div>
                </section>
                <section>
                    <div class="flex items-center justify-between px-1 mb-3"><h2 class="miuix-h3">全部虚拟机</h2></div>
                    <div class="miuix-card" style="box-shadow: var(--miuix-shadow-1);">
                        <article class="flex items-center gap-3 p-4" style="border-bottom: 1px solid var(--miuix-border);">
                            <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl miuix-surface-muted"><i data-lucide="monitor" class="h-5 w-5" style="color: var(--miuix-primary);"></i></div>
                            <div class="min-w-0 flex-1"><h3 class="miuix-h3 truncate">Ubuntu Server 22.04</h3><p class="miuix-body-sm miuix-text-secondary truncate mt-0.5">x86_64 · 2 核 · 4 GB</p></div>
                        </article>
                        <article class="flex items-center gap-3 p-4" style="border-bottom: 1px solid var(--miuix-border);">
                            <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl miuix-surface-muted"><i data-lucide="terminal" class="h-5 w-5" style="color: var(--miuix-primary);"></i></div>
                            <div class="min-w-0 flex-1"><h3 class="miuix-h3 truncate">Debian 12 ARM</h3><p class="miuix-body-sm miuix-text-secondary truncate mt-0.5">aarch64 · 4 核 · 8 GB</p></div>
                        </article>
                        <article class="flex items-center gap-3 p-4">
                            <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl miuix-surface-muted"><i data-lucide="box" class="h-5 w-5" style="color: var(--miuix-neutral-400);"></i></div>
                            <div class="min-w-0 flex-1"><h3 class="miuix-h3 truncate">Alpine Test</h3><p class="miuix-body-sm miuix-text-secondary truncate mt-0.5">x86_64 · 1 核 · 2 GB</p></div>
                        </article>
                    </div>
                </section>
            </div>
        </div>

        <!-- Scrim -->
        <div class="miuix-scrim" data-dom-id="sheet-scrim"></div>

        <!-- Bottom Sheet: Create/Edit VM -->
        <section class="miuix-sheet fixed bottom-0 left-1/2 z-50 w-full max-w-md -translate-x-1/2 max-h-[88vh] overflow-y-auto no-scrollbar">
            <!-- Handle -->
            <div class="sticky top-0 z-10 flex items-center justify-center pt-3 pb-2" style="background-color: var(--miuix-popover);">
                <div class="h-1 w-10 rounded-full" style="background-color: var(--miuix-neutral-300);"></div>
            </div>

            <!-- Header -->
            <div class="flex items-center justify-between px-5 pb-4">
                <h2 class="miuix-h2">新建虚拟机</h2>
                <button class="miuix-icon-btn" data-dom-id="btn-close-sheet" aria-label="关闭">
                    <i data-lucide="x" class="h-5 w-5"></i>
                </button>
            </div>

            <!-- Form -->
            <form class="px-5 pb-8 space-y-5" onsubmit="return false;">
                <!-- Name -->
                <div class="space-y-1.5">
                    <label class="miuix-body-sm font-medium" style="color: var(--miuix-foreground);">名称</label>
                    <input type="text" class="miuix-input" placeholder="例如：Ubuntu Server" value="Ubuntu Server 22.04">
                </div>

                <!-- Architecture -->
                <div class="space-y-1.5">
                    <label class="miuix-body-sm font-medium" style="color: var(--miuix-foreground);">架构</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button type="button" class="miuix-btn miuix-btn-primary text-sm h-10">x86_64</button>
                        <button type="button" class="miuix-btn miuix-btn-secondary text-sm h-10">aarch64</button>
                        <button type="button" class="miuix-btn miuix-btn-secondary text-sm h-10">i386</button>
                    </div>
                </div>

                <!-- CPU + Memory -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1.5">
                        <label class="miuix-body-sm font-medium" style="color: var(--miuix-foreground);">CPU 核心</label>
                        <input type="number" class="miuix-input" value="2" min="1" max="16">
                    </div>
                    <div class="space-y-1.5">
                        <label class="miuix-body-sm font-medium" style="color: var(--miuix-foreground);">内存 (GB)</label>
                        <input type="number" class="miuix-input" value="4" min="1" max="64">
                    </div>
                </div>

                <!-- Disk -->
                <div class="space-y-3">
                    <label class="miuix-body-sm font-medium" style="color: var(--miuix-foreground);">磁盘镜像</label>
                    <div class="grid grid-cols-2 gap-2 p-1 rounded-xl" style="background-color: var(--miuix-muted);">
                        <button type="button" class="miuix-btn text-sm h-9 rounded-lg" data-dom-id="disk-mode-existing" style="background-color: var(--miuix-card); color: var(--miuix-foreground); box-shadow: var(--miuix-shadow-1);">选择现有</button>
                        <button type="button" class="miuix-btn text-sm h-9 rounded-lg" data-dom-id="disk-mode-create" style="background-color: transparent; color: var(--miuix-muted-foreground);">新建空白</button>
                    </div>

                    <!-- Existing disk path -->
                    <div class="space-y-1.5" data-dom-id="disk-existing-panel">
                        <label class="miuix-caption miuix-text-secondary">硬盘镜像路径</label>
                        <div class="flex items-center gap-2">
                            <input type="text" class="miuix-input flex-1" placeholder="选择 qcow2 镜像" value="ubuntu-22.04.qcow2">
                            <button type="button" class="miuix-icon-btn shrink-0" aria-label="选择文件"><i data-lucide="folder-open" class="h-5 w-5"></i></button>
                        </div>
                    </div>

                    <!-- Create new disk -->
                    <div class="space-y-1.5 hidden" data-dom-id="disk-create-panel">
                        <label class="miuix-caption miuix-text-secondary">新镜像名称</label>
                        <input type="text" class="miuix-input" placeholder="例如：ubuntu-disk.qcow2" value="new-disk.qcow2">
                        <div class="grid grid-cols-2 gap-4 pt-1">
                            <div class="space-y-1.5">
                                <label class="miuix-caption miuix-text-secondary">容量 (GB)</label>
                                <input type="number" class="miuix-input" value="32" min="1" max="1024">
                            </div>
                            <div class="space-y-1.5">
                                <label class="miuix-caption miuix-text-secondary">格式</label>
                                <select class="miuix-input" style="appearance: auto; padding-right: 10px;">
                                    <option selected>qcow2</option>
                                    <option>raw</option>
                                    <option>vmdk</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- VNC -->
                <div class="space-y-1.5">
                    <div class="flex items-center justify-between">
                        <label class="miuix-body-sm font-medium" style="color: var(--miuix-foreground);">VNC 显示端口</label>
                        <span class="miuix-caption miuix-text-secondary">:1</span>
                    </div>
                    <input type="number" class="miuix-input" value="1" min="0" max="99">
                </div>

                <!-- Boot ISO -->
                <div class="space-y-1.5">
                    <label class="miuix-body-sm font-medium" style="color: var(--miuix-foreground);">启动 ISO（可选）</label>
                    <div class="flex items-center gap-2">
                        <input type="text" class="miuix-input flex-1" placeholder="选择 ISO 文件">
                        <button type="button" class="miuix-icon-btn shrink-0" aria-label="选择文件"><i data-lucide="folder-open" class="h-5 w-5"></i></button>
                    </div>
                </div>

                <!-- Actions -->
                <div class="grid grid-cols-2 gap-3 pt-2">
                    <button type="button" class="miuix-btn miuix-btn-secondary" data-dom-id="btn-cancel">取消</button>
                    <button type="submit" class="miuix-btn miuix-btn-primary" data-dom-id="btn-save">保存</button>
                </div>
            </form>
        </section>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
